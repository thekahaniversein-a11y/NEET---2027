<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBTS 4 · Part Test 4</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#183447;font:14px Inter,system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:10px}.head{position:sticky;top:0;z-index:20;background:#fff;border:1px solid #dbe4e3;padding:12px 15px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:12px;margin-top:12px;align-items:start}.main{height:calc(100vh - 105px);overflow:auto;background:#fff;border:1px solid #dbe4e3;border-radius:14px;padding:18px}.side{position:sticky;top:80px;height:calc(100vh - 105px);overflow:auto;background:#fff;border:1px solid #dbe4e3;border-radius:14px;padding:12px}.q{display:none}.q.active{display:block}.qnum{font-weight:800;margin-bottom:14px}.stem{white-space:pre-wrap;line-height:1.58;font-size:15px}.opts{display:grid;gap:9px;margin-top:18px}.opt{text-align:left;padding:13px;border:1px solid #dbe4e3;border-radius:10px;background:#fff;display:flex;gap:10px;align-items:flex-start;font:inherit;cursor:pointer}.letter{width:28px;height:28px;min-width:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #cbd7d4;font-weight:800}.opt.sel{background:#edf5f2}.opt.correct{background:#dfeee7;border-color:#4e8375}.opt.incorrect{background:#f3dfdf;border-color:#b56a6a}.opt.correct .letter{background:#4e8375;color:#fff}.opt.incorrect .letter{background:#b56a6a;color:#fff}.mark{font-weight:900;margin-left:auto}.controls{margin-top:18px;display:flex;gap:8px;justify-content:space-between}.controls button{padding:10px 14px;border:1px solid #dbe4e3;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#183447!important;color:#fff}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.p{height:33px;border:1px solid #d6e0de;background:#fff;border-radius:7px;cursor:pointer}.p.cur{background:#183447;color:#fff}.p.ans{background:#e7f1ed}.p.correct{background:#dfeee7;border-color:#4e8375}.p.incorrect{background:#f3dfdf;border-color:#b56a6a}.result{display:none;margin-top:12px;padding:12px;border:1px solid #dbe4e3;border-radius:10px;background:#fff}.legend{font-size:10px;color:#71818a;line-height:1.7;margin-top:10px}@media(max-width:850px){.layout{grid-template-columns:minmax(0,1fr) 200px}.main{height:calc(100vh - 100px)}.side{height:calc(100vh - 100px);top:75px}}</style></head><body><div class="app"><div class="head"><div><div class="title">CBTS 4 · Part Test 4</div><div style="font-size:11px;color:#71818a">180 Questions · 180 Minutes · 720 Marks</div></div><div id="timer">180:00</div></div><div class="layout"><main class="main"><div id="qnum" class="qnum"></div><div id="qbody"></div><div class="controls"><button id="prev">Previous</button><div><button id="next">Next</button> <button id="submit" class="primary">Submit Test</button></div></div><div class="result"></div></main><aside class="side"><b>QUESTION PALETTE</b><div class="palette" style="margin-top:10px"></div><div class="legend">Fixed palette · Correct ✓ · Incorrect ✕<br>Long questions scroll in the main panel.</div></aside></div></div><script>const QUESTIONS=[{"id": 1, "text": "1. Read the following statements\n1. Kinetic energy is conserved at all instants\nduring a collision process.\n2. In an elastic collision, the deformation of the\nbodies can be visualized as a compressed\nspring that completely recoils, returning all\nstored energy back to kinetic form.\n3. A completely inelastic collision is one in which\nthe two bodies stick together after impact,\nproducing the maximum possible loss of\nkinetic energy consistent with momentum\nconservation.\n4. In a general inelastic collision, some kinetic\nenergy is transformed into other forms (heat,\nsound, internal energy), so the final kinetic\nenergy is always less than the initial kinetic\nenergy.\nWhich combination is correct?\n(a) 1, 2 and 3\n(b) 2, 3 and 4 only\n(c) 1, 3 and 4\n(d) All four statements"}, {"id": 2, "text": "2. Block of mass M = 5 kg is kept inside a lift, which\nstarts motion from rest in vertical upward\ndirection with uniform acceleration [a = 4 m/sec²]\nPower\nPower delivered to block\nby force\n(in watt)\nA. By normal at 5 sec\nP. -500\nB. By normal in 5 sec\nQ. 700\nC. By Mg (gravity) at 5 sec\nR. -1000\nD. By Mg (gravity) in 5 sec\nS. 1400\n(a) A–P; B–Q; C–R; D–S\n(b) A–Q; B–S; C–R; D–P\n(c) A–S; B–Q; C–P; D–R\n(d) A–S; B–Q; C–R; D–P"}, {"id": 3, "text": "3. Consider a rubber ball freely falling from a height\nh = 4.9 m onto a horizontal elastic plate. Assume\nthat the duration of collision is negligible and the\ncollision with the plate is totally elastic.\nThen the velocity as a function of time and the\nheight as a function of time will be:\n(a)\n(b)\n(c)\n(d)"}, {"id": 4, "text": "4. A bob of mass M is suspended by a light rigid rod\nof length L. The horizontal velocity v at position A\nis just sufficient to make it reach point B. The\nangle θ at which the speed of the bob is half of\nthat at A satisfies:\nθ = π\nπ\n4 < θ < π\n(a)\n(b)\n\n(c)\n(d)\nπ\n2 < θ < 3π\n3π\n\n4 < θ < π"}, {"id": 5, "text": "5. A 2 kg block starts from rest at x = 0 on a\nhorizontal table (μk = 0.20,  g = 10 m s−2). A\nhorizontal force F(x) acts on the block while\nsliding to x = 6 m as shown in the graph\nAssuming the block never reverses direction, its\nspeed at x = 6 m is:\n(a)\n(b)\n1 m s−1\n2 m s−1\n(c)\n(d)\n3 m s−1\n4 m s−1"}, {"id": 6, "text": "6. Statement 1: Since comets move around the sun\nin an elliptical orbit and the gravitational force on\nthe comet is not normal to the comet’s velocity so,\nthe work done by the gravitational force over\ncomplete orbit is not zero.\nStatement 2: A walking man whose foot never\nslips, the static friction does no work on the man.\n(a) Statement 1 is incorrect; Statement 2 is\ncorrect\n(b) Statement 1 is correct; Statement 2 is\nincorrect\n(c) Both statements are correct\n(d) Both statements are incorrect"}, {"id": 7, "text": "7. A raindrop falling from a height ℎ above ground,\nattains a near terminal velocity when it has fallen\n\nthrough a height\n4 ℎ. Which of the diagrams\ncorrectly shows the change in kinetic and\npotential energy of the drop during its fall up to\nthe ground?\n(a)\n(b)\n(c)\n(d)"}, {"id": 8, "text": "8. A typical family in Delhi needs 10 kW of power\nsupply. Direct solar energy is incident on the\nhorizontal surface at an average rate of 200 W per\nsquare metre. If 15% of this energy can be\nconverted to useful electrical energy, then how\nmuch area is required to fulfill the requirement of\nthe family?\n(a) 222.22 m²\n(b) 555.55 m²\n(c) 333.33 m²\n(d) 444.44 m²"}, {"id": 9, "text": "9. Assertion (A): In every collision between two\nbodies, the total linear momentum of the system\nremains constant.\nReason (R): During the collision, the mutual\nimpulsive forces acting between the two bodies\nare equal in magnitude and opposite in direction\nat every instant.\nWhich of the following is correct?\n(a) Both A and R are true, and R is the correct\nexplanation of A.\n(b) Both A and R are true, but R is not the correct\nexplanation of A.\n(c) A is true, but R is false.\n(d) A is false, but R is true."}, {"id": 10, "text": "10. A body of mass m travels in a straight line with\nvelocity v = α ⋅x3/2, where α is constant. Work\ndone by the net force during its displacement\nfrom x = 0 to x = x0 is:\nmα2⋅x03\n(a)\n\n(b) mα2x0\n\n(c) 2mα2x0\n\n(d) None of the above"}, {"id": 11, "text": "11. A block of mass 𝑚𝑚 is situated on a rough incline. It\nis connected to a spring of spring constant 𝑘𝑘. The\nblock is released from rest with the spring in the\nunstretched position. The block moves a distance\n𝑥𝑥 down the incline before coming to rest. The\ncoefficient of friction between the block and the\nincline is 𝜇𝜇. (Assume that the spring has negligible\nmass and pulley is frictionless.) Which of the\nfollowing options is true\n\n2 kx2 + μmgxcosθ = mgxsinθ\n(a)\n\n2 kx2 + mgxsinθ = μmgxcosθ\n(b)\n\n2 kx2 = μmgxcosθ + mgxsinθ\n(c)\n(d) mgxsinθ −μmgxcosθ = kx2"}, {"id": 12, "text": "12. Two inclined frictionless tracks, one gradual and\nthe other steep, meet at point 𝐴𝐴, from where two\nstones are allowed to slide down from rest, one\non each track.\nWhich of the following statements is correct?\n(a) Both the stones reach the bottom at the same\ntime but not with the same speed.\n(b) Both the stones reach the bottom with the\nsame speed and stone I reaches the bottom\nearlier than stone II.\n(c) Both the stones reach the bottom with the\nsame speed and stone II reaches the bottom\nearlier than stone I.\n(d) Both the stones reach the bottom at different\ntimes and with different speeds."}, {"id": 13, "text": "13. In figure shown, car A is traveling due north\nwith velocity va and car B is traveling due east\nwith velocity vb (va > vb). They collide and stick\nto each other. Here 1, 2, 3, 4 shows possible\ndirection of motion of cars after collision.\nWhich is most likely?\n\n(a)\n(b)\n\n(c)\n\n(d)"}, {"id": 14, "text": "14. Statement-1: In an inelastic collision of two\nbodies, the total linear momentum does not\nchange after the collision.\nStatement-2: The rate of change of total\nmomentum of a many-particle system is\nproportional to the external force on the system.\n(a) Statement-1 is true and Statement-2 is false\n(b) Statement-1 is false and Statement-2 is true\n(c) Both are false\n(d) Both are true"}, {"id": 15, "text": "15. An electric pump is used to fill an overhead tank of\ncapacity 9 m3, kept at a height of 10 m above the\nground. If the pump takes 5 minutes to fill the tank\nby consuming 10 kW power, the efficiency of the\npump should be: (Take 𝑔𝑔= 10 ms−2)\n(a) 60%\n(b) 40%\n(c)\n20%\n(d) 30%"}, {"id": 16, "text": "16. The potential energy of a body of mass m is U =\nax + by. The magnitude of the acceleration of the\nbody will be:\nab\n(a)\nm\na+b\n(b)\nm\n√a2+b2\n(c)\nm\na2+b2\n(d)\nm"}, {"id": 17, "text": "17. A bullet of mass 𝑚𝑚 moving horizontally with speed\n𝑢𝑢 strikes a suspended wooden block of mass 𝑀𝑀\nand gets embedded into it. If the block rises to\n𝐿𝐿\nheight\n2, where 𝐿𝐿 is the length of the string with\nwhich the wooden block is connected, the initial\nvelocity (𝑢𝑢) of the bullet is:\nM+m\n(a) ቀ\nm ቁඥgL\nm\n(b) ቀ\nM+mቁඥgL\nM+m\n(c) ቀ\nm ቁඥ2gL\n(d) ඥ2gL"}, {"id": 18, "text": "18. A cannon ball is fired with a velocity 200 m/s\nat an angle of 60° with the horizontal. At the\nhighest point of its flight, it explodes into 3\nequal fragments, one going vertically upwards\nwith a velocity 100 m/s, the second one falling\nvertically downwards with a velocity 100 m/s.\nThe third fragment will be moving with a\nvelocity:\n(a) 100 m/s in the horizontal direction\n(b) 300 m/s in the horizontal direction\n(c) 300 m/s in a direction making an angle of\n60° with the horizontal\n(d) 200 m/s in a direction making an angle of\n60° with the horizontal"}, {"id": 19, "text": "19.  A vertical spring of force constant 100 N m−1is\nattached with a hanging mass of 10 kg. Now an\nexternal force is applied on the mass so that the\nspring is stretched by an additional 2 m. The work\ndone by the external force is: (𝑔𝑔= 10 ms−2)\n(a) 200 J\n(b) 400 J\n(c)\n450 J\n(d) 600 J"}, {"id": 20, "text": "20. 20 litres of water per second is lifted from a well\nthrough 30 m and delivered with a velocity of 18\nkm/h. Power of the motor used for this purpose\nis:\n(a) 9.24 kW\n(b) 6.25 kW\n(c)\n2.75 kW\n(d) 18 kW"}, {"id": 21, "text": "21. Which of the following statements is/are true\n1. Potential energy of a system decreases if\nconservative forces do negative work on the\nsystem\n2. Potential energy of a system decreases if\nconservative forces do positive work on the\nsystem\n3. Work done by friction over a closed path is\nzero, so potential energy can be associated\nwith friction\n4. Work done by a body against friction always\nresults in loss of kinetic energy\n(a) 1, 4\n(b) 2, 4\n(c)\n1, 3, 4\n(d) Only 2"}, {"id": 22, "text": "22. A mass of 1 kg is acted upon by a single force 𝐹𝐹⃗=\n(4𝚤𝚤̂ + 4𝚥𝚥̂) N. This mass is displaced from (0, 0) to\n(1 m, 1 m). If initially, the speed of the particle was\n2 m/s, its final speed should approximately be:\n(a) 6 m/s\n(b) 4.5 m/s\n(c)\n8 m/s\n(d) 7.2 m/s"}, {"id": 23, "text": "23. A mass m moves with a velocity v and collides\ninelastically with another identical mass at rest.\nAfter collision, the first mass moves with velocity\nv\n√3 in a direction perpendicular to the initial\ndirection of motion. Find the speed of the 2nd\nmass after collision\n\n(a)\n√3 v\nv\n(b)\n√3\n(c) V\n(d) √3v"}, {"id": 24, "text": "24. At a school fair, a 0.20 kg rubber cricket ball is\nreleased from rest at height ℎ on a smooth\nwooden ramp; it leaves the ramp horizontally and\nmust strike a hanging coconut that falls only if the\nball’s horizontal momentum on exit is at least 1.0\nkg m s-1. With 𝑔𝑔= 10 m s−2, determine the\nminimum height ℎ.\n(a) 1.10 m\n(b) 0.20 m\n(c) 1.25 m\n(d) 0.30 m"}, {"id": 25, "text": "25. Two objects A and B are moving with same K.E.\nThey are brought to rest by applying the same\nretarding acceleration. Mass of A and B are m1\nand m2 respectively. Find the ratio of their\nstopping distances.\n(b) m1: m2\n(a) 1:1\nm2: m1\n(c)\n(d) ඥm1: ඥm2"}, {"id": 26, "text": "26. A particle of mass m collides head-on with another\nstationary particle of mass M such that the second\nparticle starts moving and the first particle comes\nto rest after the collision. Which of the following\nconditions is valid if the coefficient of restitution\nis e?\n(a) e = 0\nm\n(b) e =\nM ≤1\nm\n(c) e =\nM ≥1\nM\n(d) e =\nm ≤1"}, {"id": 27, "text": "27. A block of mass m is released from rest at point A.\nThe compression of the spring when the speed of\nthe block is maximum is:\nmgsinθ\n(a)\nk\n2mgsinθ\n(b)\nk\nmgcosθ\n(c)\nk\nmg\n(d)\nk"}, {"id": 28, "text": "28. On a frictionless horizontal surface, a ball of mass\n𝑚𝑚 moving with speed 𝑣𝑣 collides elastically with\nanother ball of equal mass 𝑚𝑚 which is initially at\nrest. After collision, the first ball moves at an angle\nof 30° to its initial direction. The kinetic energy of\nthe second ball after the collision is:\n(a) 1\n(b) 1\n4 mv2\n3 mv2\n(c)\n(d) 1\n\n6 mv2\n8 mv2"}, {"id": 29, "text": "29. A moving mass of 8 kg collides elastically with a\nstationary mass of 2 kg. If 𝐸𝐸 be the initial kinetic\nenergy of the moving mass, the kinetic energy left\nwith it after the collision will be:\n(a) 0.80 E\n(b) 0.64 E\n(c)\n0.36 E\n(d) 0.08 E"}, {"id": 30, "text": "30. Two men with weights in ratio 4:3 run up a\nstaircase in time with ratio 12:11. The ratio of the\npower of first to that of second is:\n(a)\n(b)\n\n(c)\n(d)"}, {"id": 31, "text": "31. In a simple pendulum, the bob (mass m) is\nreleased from rest when the string is horizontal.\nMaximum tension developed in the string in\nconsequent motion will be:\n(a)\nmg\n(b) 2mg\n(c)\n6mg\n(d) 3mg"}, {"id": 32, "text": "32. A light spring is hung vertically from a fixed\nsupport and a heavy mass m is attached to its\nlower end. The mass is then slowly lowered to its\nequilibrium position. This stretches the spring by\nan amount d. If the same body is permitted to fall\ninstead, through what distance does it stretch the\nspring?\nd\n\n(a)\n(b) d\n3d\n(c)\n\n(d) 2d"}, {"id": 33, "text": "33. A ball of mass 1 kg moving with a velocity of\n0.4 m/s collides with another stationary ball. After\nthe collision, the first ball moves with a velocity of\n0.3 m/s in a direction making an angle of 90° with\nits initial direction. The momentum of the second\nball after the collision will be (in kg m/s):\n(a)\n0.1\n(b) 0.3\n(c)\n0.5\n(d) 0.7"}, {"id": 34, "text": "34. A body of mass m is accelerated uniformly from\nrest to a speed v in a time T. The instantaneous\npower delivered to the body as a function of time\nt, is given by:\nmv2\n(a)\nT2 t\nmv2\n(b)\nT2 t2\nmv2\n\n(c)\nT2 t2\n\nmv2\n\n(d)\nT2 t"}, {"id": 35, "text": "35. A metal block of mass 2 kg is pulled from position\n(1,4) meters to (3,8) meters on a smooth\nhorizontal surface. The total work done by the\napplied force during this motion is 44 J. The\nacceleration of the block due to this force will be.\n(a) 2ı̂ + 5ȷ̂ m/s2\n(b) 4ı̂ + 3ȷ̂ m/s2\n(c) 3ı̂ + 4ȷ̂ m/s2\n(d) 5ı̂ + 2ȷ̂ m/s2"}, {"id": 36, "text": "36. Two balls having masses in the ratio 1:3, both\nmoving at 10 m/s, collide head-on. If the\n\ncoefficient of restitution is\n3, then the speed of the\nsecond ball after the collision is:\n\n(a)\n3  m/s\n\n(b)\n3  m/s\n(c) 10 m/s\n(d) None"}, {"id": 37, "text": "37. An object is dragged along a horizontal surface by\na machine which delivers a constant power. How\ndoes the distance moved by the object depend on\ntime 𝑡𝑡?\n(a)\nt3/4\n(b) t3/2\n(c)\nt1/4\n(d) t1/2"}, {"id": 38, "text": "38. Choose the correct statement:\n(a) Work done by internal forces is equal to\nchange in potential energy\n(b) Net work done on the body is equal to change\nin total mechanical energy\n(c) Net work done by all forces other than\nconservative forces is equal to change in total\nmechanical energy\n(d) Net work done on the system by internal\nforces is always zero"}, {"id": 39, "text": "39. The kinetic energy of a body decreases by 19%.\nWhat is the percentage decrease in momentum?\n(a)\n19%\n(b) 31%\n(c)\n11%\n(d) 10%"}, {"id": 40, "text": "40. A particle is projected vertically upwards with a\nspeed of 16 ms-1. After some time, when it again\npasses through the point of projection, its speed\nis found to be 8 ms-1. It is found that the work\ndone by air resistance is the same during the\nupward and downward motions. Then the\nmaximum height attained by the particle is:\n(a)\n8 m\n(b) 4.8 m\n(c)\n17.6 m\n(d) 12.8 m"}, {"id": 41, "text": "41. A bob hangs from a rigid support by an\ninextensible string of length 𝑙𝑙. It is released from\nrest when the string makes an angle of 60° with\nthe vertical. The speed of the bob at the lowest\nposition is:\n(a)\n(b)\nඥgl\nඥ3gl\n(c)\n(d)\nඥ5gl\nඥ2gl"}, {"id": 42, "text": "42. If a body starts its motion along a smooth track\nfrom 𝑃𝑃 as shown in the figure, then its velocity at\n𝑅𝑅 will be (𝑔𝑔= 10 m/s2)\n(a)\n(b)\n2√7 m/s\n√70 m/s\n(c)\n5 m/s\n(d) 10 m/s"}, {"id": 43, "text": "43. A 1000 g ball is pulled up to the top of a slope as\nshown in the diagram. Gain in potential energy of\nthe ball is\n(a)\n10 J\n(b) 12 J\n(c)\n8 J\n(d) 9 J"}, {"id": 44, "text": "44. A stone of mass 1 kg is tied with a string and it is\nwhirled in a vertical circle of radius 1 m. If tension\nat the highest point is 14 N, then velocity at the\nlowest point will be:\n(a)\n3 m/s\n(b) 4 m/s\n(c)\n6 m/s\n(d) 8 m/s"}, {"id": 45, "text": "45. A household of Dwarka Sector 8, uses five 10 W\nbulbs and a 50 W ceiling fan for 10 hours each day.\nIf the cost of 1 unit of electricity in Delhi is Rs 7.\nThen what will be the monthly cost of electricity.\n(a)\nRs 200\n(b) Rs 210\n(c)\nRs 300\n(d) Rs 310"}, {"id": 46, "text": "46. The total vapour pressure of a binary solution is\ngiven by P = (100 + 160 XB) mm Hg Where XB is the\nmole fraction of the component B. Choose the\ncorrect statements:\n1. Vapour pressure of solution is less than the\npure B component\n2. Vapour pressure of solution is more than the\npure A component\n3. Vapour pressure of pure A is 100 mm Hg and\nthat of pure B is 160 mm Hg\n4. Vapour pressure of solution increases with the\nmole fraction of component B\n(a) 1, 2, 3 and 4\n(b) 2, 3 and 4\n(c) 2 and 3 only\n(d) 1, 2 and 4"}, {"id": 47, "text": "47. Match Column I with Column II and select the\ncorrect option\nColumn-I\nColumn-II\n(A) π₁: 0.1 M glucose;\n(P) π₁ and π₂ are\nπ₂: 0.1 M urea\nisotonic\n(B) π₁: 0.1 M NaCl;\n(Q) No net migration\nπ₂: 0.1 M Na₂SO₄\nof solvent across the\nmembrane\n(C) π₁: 0.1 M NaCl;\n(R) π₁ is hypertonic to\nπ₂: 0.1 M KCl\nπ₂\n(D) π₁: 0.1 M CuSO₄;\n(S) π₁ is hypotonic to\nπ₂: 0.1 M sucrose\nπ₂\n(a) A → S; B → P, Q; C → R; D → Q\n(b) A → R; B → Q; C → S; D → P\n(c) A → P, Q B → S C → P, Q D → R\n(d) A → Q, S; B → R; C → P, R; D → P"}, {"id": 48, "text": "48. Blood cell fluid is isotonic with\n(a) 0.9 m NaCl\n(b) 0.9% (w/V) NaCl\n(c) 0.11 m NaCl\n(d) 0.11% (w/V) KCl"}, {"id": 49, "text": "49. The vapour pressures of pure liquids A and B are\n400 and 600 mmHg, respectively at 298K. On\nmixing the two liquids, the sum of their initial\nvolumes is equal to the volume of the final\nmixture. The mole fraction of liquid B is 0.5 in the\nmixture. The vapour pressure of the final solution,\nthe mole fractions of components A and B in\nvapour phase, respectively are:\n(a) 450 mmHg, 0.4, 0.6\n(b) 500 mmHg, 0.5, 0.5\n(c) 450 mmHg, 0.5, 0.5\n(d) 500 mmHg, 0.4, 0.6"}, {"id": 50, "text": "50. FeCl₃\n(aq)\non\nreaction\nwith\naqueous\nK₄[Fe(CN)₆] solution gives blue colour. They\nare\nseparated\nby\na\nsemipermeable\nmembrane AB. Due to osmosis there is\n(a) Blue colour form in side x\n(b) Blue colour form in side y\n(c) Blue colour form in side x and y\n(d) No blue colour formation"}, {"id": 51, "text": "51. Consider the following statements.\n1. Mole fraction, weight percentage and molarity\nare temperature independent.\n2. A mixture of chloroform and acetone forms a\nsolution with negative deviation from Raoult’s\nlaw.\n3. Solubility of gases in liquids decreases with rise\nin temperature.\n4. A solution in which no more solute can be\ndissolved at the fixed temperature and\npressure is called saturated solution.\nCorrect statements are:\n(a) 1, 2 and 4\n(b) 2, 3 and 4\n(c) 2 and 3 only\n(d) 1, 2, 3 and 4"}, {"id": 52, "text": "52. What is the molarity of SO₄²⁻ ion in aqueous\nsolution that contains 34.2 ppm of Al₂(SO₄)₃?\n(Assume complete dissociation and density of\nsolution 1 g/mL)\n(a) 3 × 10⁻⁴ M\n(b) 2 × 10⁻⁴ M\n(c) 10⁻⁴ M\n(d) None of these"}, {"id": 53, "text": "53. Given below are two statements.\nStatement I: Cooking time is reduced in pressure\ncooker.\nStatement II: Boiling point of H₂O reduces in\npressure cooker.\nIn the light of above statements, choose the most\nappropriate answer from the options given below.\n(a) Both statement I and statement II are\nincorrect\n(b) Statement I is correct but statement II is\nincorrect\n(c) Both statement I and statement II are correct\n(d) Statement I is incorrect but statement II is\ncorrect"}, {"id": 54, "text": "54. A mixture of benzene and toluene has 39.52 mm\nHg vapour pressure at 300 K. The vapour pressure\nof pure benzene is 50.71 mm Hg. If mole fraction\nof toluene in solution is 0.6, then its vapour\npressure in the mixture will be:\n(a) 38.08 mm Hg\n(b) 32.06 mm Hg\n(c) 19.24 mm Hg\n(d) 28.08 mm Hg"}, {"id": 55, "text": "55. According to Henry’s law of partial pressure which\nof the following option is incorrect?\n(a) 𝐾𝐾𝐻𝐻 is characteristic constant for a given gas–\nsolvent system\n(b) Higher is the value of 𝐾𝐾𝐻𝐻, lower is solubility of\ngas for a given partial pressure of gas\n(c) 𝐾𝐾𝐻𝐻 has no temperature dependence\n(d) 𝐾𝐾𝐻𝐻 has same dimensions as of pressure"}, {"id": 56, "text": "56. Two beakers of capacity 500 mL were taken. One\nof these beakers, labelled as “A”, was filled with\n400 mL water whereas the beaker labelled “B”\nwas filled with 400 mL of 2 M solution of NaCl. At\nthe same temperature both the beakers were\nplaced in closed containers of same material and\nsame capacity as shown in Fig. At a given\ntemperature, which of the following statement is\ncorrect about the vapour pressure of pure water\nand that of NaCl solution.\n(a) vapour pressure in container (B) is twice the\nvapour pressure in container (A).\n(b) vapour pressure in container (A) is less than\nthat in container (B).\n(c) vapour pressure is equal in both the\ncontainers.\n(d) vapour pressure in container (A) is more than\nthat in container (B)."}, {"id": 57, "text": "57. Match List–I with List–II.\nList–II\nList–I\nvan’t Hoff factor (i)\na. Na₂CO₃ (Degree of\n(i) 3.4\ndissociation 70%)\nb. K₄[Fe(CN)₆] (Degree\n(ii) 1.8\nof dissociation 60%)\nc. Al₂(SO₄)₃ (Degree of\n(iii) 2.4\ndissociation 75%)\nd. C₆H₅COOH (Degree\n(iv) 4\nof dissociation 80%)\n(a) a(i), b(iii), c(iv), d(ii)\n(b) a(i), b(iii), c(ii), d(iv)\n(c) a(iii), b(i), c(ii), d(iv)\n(d) a(iii), b(ii), c(iv), d(i)"}, {"id": 58, "text": "58. A set of solutions is prepared using 180 g of water\nas a solvent and 10 g of different non-volatile\nsolutes A, B and C. The relative lowering of vapour\npressure in the presence of these solutes is in the\norder\n[Given, molar mass of A = 100 g mol−1; B = 200 g\nmol−1; C = 10,000 g mol−1]\n(a) B > C > A\n(b) C > B > A\n(c) A > B > C\n(d) A > C > B"}, {"id": 59, "text": "59. 29.2% (w/w) HCl stock solution has a density of\n1.25 g/mL. The molecular weight of HCl is 36.5\ng/mol. The volume (mL) of stock solution required\nto prepare a 200 mL solution of 0.4 M HCl is:\n(a) 8 mL\n(b) 10 mL\n(c) 6 mL\n(d) 7 mL"}, {"id": 60, "text": "60. Which one of the statements given below\nconcerning properties of solutions, describes a\ncolligative effect?\n(a) Boiling point of pure water decreases by the\naddition of ethanol\n(b) Vapour pressure of pure water decreases by\nthe addition of nitric acid\n(c) Vapour pressure of pure water decreases by\nthe addition of NH2CONH2\n(d) Boiling point of pure benzene increases by the\naddition of toluene"}, {"id": 61, "text": "61. 0.6 mL of acetic acid having density 1.06 g mL⁻¹ is\ndissolved in 1 L of water. The depression in\nfreezing point observed for this strength of acid\nwas 0.0205°C. The van’t Hoff factor of acid is [Kf =\n1.86 K kg mol⁻¹]\n(a) 0.04\n(b) 2.7\n(c) 1.04\n(d) 0.75"}, {"id": 62, "text": "62. The van’t Hoff factor i for an electrolyte which\nundergoes dissociation and association in solvent\nare respectively:\n(a) greater than one and less than one\n(b) less than one and greater than one\n(c) less than one and less than one\n(d) greater than one and greater than one"}, {"id": 63, "text": "63. Assertion: 35% v/v solution of ethylene glycol is\nused in cars for cooling the engine\nReason: At this concentration ethylene glycol\nlowers the freezing point of water to 255.4 K\n(a) Both A and R are true and R is the correct\nexplanation of A\n(b) Both A and R are true but R is not the correct\nexplanation of A\n(c) A is true but R is false\n(d) A is false, but R is true."}, {"id": 64, "text": "64. Choose the correct statement of azeotropes\n(a) Show no deviation from Raoult’s law\n(b) Binary mixture and have same composition in\nliquid and vapour phase\n(c) Can be separated by fractional distillation\n(d) All ethanol water mixtures are minimum\nboiling azeotropes"}, {"id": 65, "text": "65. Which of the following is not an example of solid\nsolutions?\n(a) Glucose dissolved in water\n(b) Solution of hydrogen in palladium\n(c) Amalgam of mercury with sodium\n(d) Copper dissolved in gold"}, {"id": 66, "text": "66. Statement 1: Osmotic pressure is widely used to\ndetermine molar masses of biomolecules\nStatement 2: Biomolecules are not stable at high\ntemperature\n(a) Statement 1 is correct; Statement 2 is\nincorrect\n(b) Statement 1 is incorrect; Statement 2 is\ncorrect\n(c) Both statements are correct\n(d) Both statements are incorrect"}, {"id": 67, "text": "67. A graph of vapour pressure and temperature for\nthree different liquids X, Y, and Z is shown below:\nThe following inferences are made:\n(1) X has higher intermolecular interactions\ncompared to Y.\n(2) X has lower intermolecular interactions\ncompared to Y.\n(3) Z has lower intermolecular interactions\ncompared to Y.\nThe correct inference(s) is/are:\n(a)\n1 and 3\n(b) 1\n(c)\n\n(d) 3"}, {"id": 68, "text": "68. A solution containing 34.2 g per dm³ of sucrose\n(molar mass = 342 g/mol) is isotonic with 15%\n(w/v) solution of a non-volatile and nonelectrolyte\nsolute at same temperature. The molar mass of\nthe solute is:\n(a) 750 g/mol\n(b) 1500 g/mol\n(c) 150 g/mol\n(d) 300 g/mol"}, {"id": 69, "text": "69. Which of the following given statements are\nincorrect\n1. 1.5 ppm of fluoride ions in water prevents\ntooth decay\n2. NaCl is present in rat poision\n3. German silver is a mixture of copper, zinc and\nnickel\n4. ΔS and ΔG are always negative for both ideal\nand non ideal solutions\n(a) 1, 2 and 4\n(b) 1 and 2 only\n(c) 2 and 3 only\n(d) 2, 3 and 4"}, {"id": 70, "text": "70. Match Column I with Column II and choose\nthe correct option\nColumn–I\nColumn–II\n(A) 0.1 M Al₂(SO₄)₃\n(P) Solution with highest\nboiling point\n(Q) Van’t Hoff factor is\n(B) 0.1 M AlPO₄\ngreater than 1\n(C) 0.1 M urea\n(R) Solution with lowest\nosmotic pressure\n(D) 0.1 M MgCl₂\n(S) Solution with lowest\nfreezing point\n(a) A → P, Q, S; B → Q; C → R; D → Q\n(b) A → Q, S; B → P; C → R; D → S\n(c) A → Q, R; B → R; C → S; D → Q\n(d) A → P, Q; B → S; C → Q; D → P"}, {"id": 71, "text": "71. Liquids A and B form ideal solution over the entire\nrange of composition. At temperature T,\nequimolar binary solution of liquids A and B has\nvapour\npressure\n\nTorr.\nAt\nthe\nsame\ntemperature, a new solution of A and B having\nmole fractions XA and XB, respectively, has vapour\npressure of 22.5 Torr. The value of XA/XB in the\nnew solution is\n(given that the vapour pressure of pure liquid A is\n20 Torr at temperature T)\n(a)\n3.5\n(b) 9.5\n(c)\n\n(d) 19"}, {"id": 72, "text": "72. Which of the following is an example of positive\ndeviation from Raoult's law?\n(a) CHCl₃ and C₆H₆\n(b) Methanol and H₂O\n(c) CHCl₃ and HNO₃\n(d) H₂O and HCl"}, {"id": 73, "text": "73. Consider 0.1 M solutions of two solutes X and Y.\nThe solute X behaves as a univalent electrolyte\nwhile the solute Y dimerises in solution. Which of\nthe following statements are correct regarding\nthese solutions?\n1. The boiling point of the solution of X will be\nhigher than that of Y\n2. The osmotic pressure of the solution of Y will\nbe lower than that of X\n3. The freezing point of the solution of X will be\nlower than that of Y\n4. The relative lowering of vapour pressure of\nboth the solutions will be the same\nSelect the correct answer from the options given\nbelow:\n(a) 1, 2 and 3\n(b) 2, 3 and 4\n(c) 2 and 3 only\n(d) 1 and 3 only"}, {"id": 74, "text": "74. Pure water freezes at 273 K and 1 bar. The\naddition of 34.5 g of ethanol to 500 g of water\nchanges the freezing point of the solution. Use the\nfreezing point depression constant of water as 2 K\nkg mol⁻¹. The figures shown below represent plots\nof vapour pressure (V.P.) versus temperature (T).\n[Molecular weight of ethanol is 46 g mol⁻¹]\nAmong the following, the option representing\nchange in the freezing point is:\n(a)\n(b)\n(c)\n(d)"}, {"id": 75, "text": "75. Osmotic pressure of a solution containing 3.42 g\nof sucrose in 100 mL of solution at 27°C is:\n(a)\n1.28 atm\n(b) 2.46 atm\n(c)\n4.02 atm\n(d) 3.1 atm"}, {"id": 76, "text": "76. Assertion: Intravenous injections are always\ndissolved in water containing salts at particular\nionic concentrations\nReason: In isotonic solutions no osmosis occur\nwhich prevents cell or tissue injury\n(a) Both A and R are true and R is the correct\nexplanation of A\n(b) Both A and R are true but R is not the correct\nexplanation of A\n(c) A is true but R is false\n(d) A is false, but R is true."}, {"id": 77, "text": "77. Statement 1: Molality of the solution if the mole\nfraction of urea in water is 0.2 will be 13.9 m\nStatement 2: If 100 mL of 5 M HNO₃ is mixed with\n800 mL of 2.5 M HNO₃ solution, then the molarity\nof the resultant solution becomes 1.66 M\n(a) Statement 1 is correct; Statement 2 is\nincorrect\n(b) Statement 1 is incorrect; Statement 2 is\ncorrect\n(c) Both statements are correct\n(d) Both statements are incorrect"}, {"id": 78, "text": "78. For a solution formed by mixing liquids L and M,\nthe vapour pressure of L plotted against the mole\nfraction of M in solution is shown in the following\nfigure. Here 𝑥𝑥𝐿𝐿 and 𝑥𝑥𝑀𝑀 represent mole fractions\nof L and M, respectively, in the solution. The\ncorrect statement(s) applicable to this system is\n(are):\n1. The point Z represents vapour pressure of\npure liquid M and Raoult's law is obeyed\nfrom 𝑥𝑥𝐿𝐿= 0 to 𝑥𝑥𝐿𝐿= 1\n2. The point Z represents vapour pressure of\npure liquid L and Raoult's law is obeyed\nwhen 𝑥𝑥𝐿𝐿→1\n3. The point Z represents vapour pressure of\npure liquid M and Raoult's law is obeyed\nwhen 𝑥𝑥𝐿𝐿→0\n4. Attractive\nintermolecular\ninteractions\nbetween L–L in pure liquid L and M–M in\npure liquid M are stronger than those\nbetween L–M when mixed in solution.\n(a) 1, 2 and 3\n(b) 2 and 4 only\n(c) 1, 2 and 4\n(d) 3 and 4 only"}, {"id": 79, "text": "79. If boiling point of an aqueous solution is 100.1°C,\nwhat is its freezing point?\nGiven, enthalpy of fusion and vaporisation of\nwater are 80 cal g⁻¹ and 540 cal g⁻¹ respectively:\n(a) 0.361°C\n(b) –0.361°C\n(c) –3.61°C\n(d) None of these"}, {"id": 80, "text": "80. On dissolving 0.5 g of a non-volatile non-ionic\nsolute to 39 g of benzene, its vapour pressure\ndecreases from 650 mm Hg to 640 mm Hg. The\ndepression of freezing point of benzene (in K)\nupon addition of the solute is\n(Molar mass and the molal freezing point\ndepression constant of benzene are 78 g mol⁻¹\nand 5.12 K kg mol⁻¹, respectively)\n(a) 0.82 K\n(b) 1.18 K\n(c) 1.03 K\n(d) 0.96 K"}, {"id": 81, "text": "81. If Kb is the boiling point elevation constant and Kf\nis the freezing point depression constant then\nwhich of the following option represents the ratio\nof cryoscopic constant and ebullioscopic constant\nrespectively\n2⋅ΔHvap\nTb\n(a)\n2⋅ΔHfusion\nTf\n2⋅ΔHvap\nTf\n(b)\n2⋅ΔHfusion\nTb\nTf⋅ΔHvap\n(c)\nTb⋅ΔHfusion\n2⋅ΔHfusion\nTf\n(d)\n2⋅ΔHvap\nTb\n82.\nConsider the assertion reason given below for\nthe graph shown above\nAssertion: Phenol and aniline is an example of\nthis type of mixture.\nReason: The intermolecular hydrogen bonding\nbetween similar molecules is stronger than the\nintermolecular hydrogen bonding between\nphenolic proton and lone pair on nitrogen\natom.\n(a) Both A and R are true, and R is the correct\nexplanation of A.\n(b) Both A and R are true, but R is not the correct\nexplanation of A.\n(c) A is true, but R is false.\n(d) A is false, but R is true.\n83. Two compounds A and B form a mixture. If A and\nB are straight chain alkanes having six and seven\ncarbons respectively, then which of the following\nstatements are true for this process:\n(a) ΔG is positive\n(b) ΔSₛᵧₛₜₑₘ is positive\n(c) ΔSsurroundings = 0\n(d) ΔH = 0\n(a) a, b and d\n(b) b, c and d\n(c) a and c only\n(d) b and d only\n84. Which of the following phenomena is based on\nosmosis\n(a) Raw mangoes shrivel when pickled in brine\n(b) Oxygen moves from alveoli into blood\n(c) A drop of ink disperses uniformly in water\n(d) Fragrance of perfume spreads across a room\n85. Which of the following shows the correct\nmovement of solvent molecules during osmosis\n1. Low to high osmotic pressure\n2. High to low concentration of solvent\n3. Low to high concentration of solute\n4. High to low concentration of solution\n5. Low to high concentration of solvent\n(a) 2, 3 and 4\n(b) 1 and 3 only\n(c) 1, 2 and 3\n(d) 2 and 3 only\n86. Statement 1: According to Henry’s law for any\nsolution the partial vapour pressure of each\nvolatile component in the solution is directly\nproportional to its mole fraction\nStatement 2: According to Raoult’s law, the\npartial pressure of gas in vapour phase is\nproportional to the mole fraction of the gas in the\nsolution\n(a) Statement 1 is incorrect; Statement 2 is\ncorrect\n(b) Statement 1 is correct; Statement 2 is\nincorrect\n(c) Both statements are correct\n(d) Both statements are incorrect\n87. The elevation in boiling point of a solution of 13.44\ng of CuCl₂ in 1 kg of water using the following\ninformation will be:\n(Molecular weight of CuCl₂ = 134.4)\n(a) 0.16\n(b) 0.05\n(c)\n0.1\n(d) 0.2\n88. The tanks used by scuba divers are filled with air\ndiluted with helium in which of kidneys, NaCl is returned to the medullary\ninterstitium by the:\n(a) Descending limb of the loop of Henle\n(b) Ascending limb of the loop of Henle\n(c) Descending limb of the vasa recta\n(d) Ascending limb of the vasa recta\n166. Statement 1: In plants like mint and jasmine the\nlateral branch arise from the base and\nunderground portion of the main stem grows\nhorizontally beneath the soil and then come out\nobliquely upward giving rise to leafy shoot\nStatement 2: In banana and pineapple, the lateral\nbranch arise from the base of the main axis and\nafter growing aerially for sometime arch\ndownwards to touch the ground\n(a) Statement 1 is correct; Statement 2 is\nincorrect\n(b) Statement 1 is incorrect; Statement 2 is\ncorrect\n(c) Both statements are correct\n(d) Both statements are incorrect\n167. Which of the following statements are correct\n1.\nThe leaf base may bear stipules, may expand\ninto a sheath or becomes swollen\n2.\nLeaf consists of three main parts\n3.\nLeaves are arranged in an acropetal order\n4.\nLeaves originate from shoot apical meristem\n(a) 1, 3 and 4\n(b) 1, 2 and 3\n(c) 2 and 4 only\n(d) All of the above\n168. Which points are not correct about Angiotensin-II?\na.\nDecreases the glomerular blood pressure\nb.\nActivates the adrenal gland to release\naldosterone\nc.\nDecreases the GFR\nd.\nPowerful vasoconstrictor\ne.\nActivates the JG cells to release renin\n(a) a, c, e\n(b) a, d, e\n(c) b, d\n(d) b, c, e\n169. Which of the following statements are incorrect\n1.\nParallel venation is the characteristic of all\nmonocotyledon\n2.\nIn silk cotton leaflets are attached at the tip\nof petiole\n3.\nPhyllotaxy is the arrangement of flowers on\nthe floral axis\n4.\nOnce the flower is formed the internodes do\nnot elongate and the axis gets condensed\n(a) 1 and 3\n(b) 2, 3 and 4\n(c) 1, 2 and 3\n(d) 2 and 3\n\n170. Consider the given two statements:\nAssertion (A): Atrial Natriuretic Factor (ANF)\nmechanism acts as a check on the renin-\nangiotens
