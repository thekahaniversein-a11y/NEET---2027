<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCERT Questions</title><style>:root{--i:#183447;--m:#71818a;--l:#dbe4e3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f2f6f4,#fbfcfa 50%,#edf4f4);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:18px;max-width:1100px;margin:auto}.head{margin-bottom:16px}.ey{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#607782}.title{font:500 34px Georgia,serif;margin:6px 0}.sub{font-size:11px;color:var(--m);letter-spacing:.12em;text-transform:uppercase}.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.chapter{border:1px solid var(--l);background:#fff;border-radius:15px;padding:17px;cursor:pointer;transition:.15s}.chapter:hover{background:#f2f7f5;border-color:#cbdad7;transform:translateY(-1px)}.chapter b{font-size:14px}.chapter span{display:block;font-size:10px;color:var(--m);margin-top:5px}.cbt{display:none}.cbt.show{display:block}.back{border:1px solid #d5e0de;background:#fff;color:#365766;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:11px;margin-bottom:10px}.frame{height:calc(100vh - 95px);min-height:650px;border:1px solid var(--l);border-radius:15px;overflow:hidden;background:#fff}.frame iframe{width:100%;height:100%;border:0}@media(max-width:650px){.chapters{grid-template-columns:1fr}.wrap{padding:12px}.title{font-size:29px}.frame{min-height:620px}}
/* SALAAR PALETTE REFRESH — soft ivory, ink, muted sage; no loud gradients */
:root{
 --ink:#202b32!important;--muted:#727c82!important;--line:#e4e7e5!important;
 --paper:#ffffff!important;--soft:#f3f6f3!important;--accent:#718b7a!important;
 --good:#4f7960!important;--primary:#526f60!important;--primary-light:#8da594!important;
 --primary-dark:#405a4c!important;--secondary:#779487!important;--success:#4f7960!important;
 --warning:#b58b4b!important;--danger:#b35e58!important;--bg:#f6f7f5!important;
 --card:#ffffff!important;--text:#202b32!important;--text-secondary:#727c82!important;
 --border:#e4e7e5!important;--header-bg:#ffffff!important;--footer-bg:#ffffff!important;
 --shadow:0 5px 20px rgba(30,45,37,.045)!important;--shadow-sm:0 2px 8px rgba(30,45,37,.035)!important;
}
html,body{background:#f6f7f5!important;color:#202b32}
button,.btn,.tab,.back,.nav button{transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease}
button,.btn,.tab,.back,.nav button{border-color:#e0e5e1!important;color:#34453c}
button:hover,.btn:hover,.tab:hover,.back:hover,.nav button:hover{background:#edf2ed!important;color:#2e4a3a!important;border-color:#cbd8cd!important}
button.active,.tab.active,.nav button.active{background:#e7efe8!important;color:#345b42!important;border-color:#cfddcf!important}
.card,.panel,.section,.stat,.subject,.qlog,.chapter,.link,.snap,.target,.tile,.box,.question-card,.question,.qcard,.item-card,.summary-card{
 border-color:#e4e8e4!important;box-shadow:0 3px 14px rgba(35,48,39,.035)
}
input,select,textarea{color:#27352d}
input:focus,select:focus,textarea:focus{outline-color:#9eb3a1!important;border-color:#9eb3a1!important}
progress,.progress,.bar{accent-color:#718b7a}
progress::-webkit-progress-value,.progress i,.bar i{background:#718b7a!important}
a{color:#506f5a}
::selection{background:#dce8dc;color:#24382b}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

</style></head><body><div class="wrap"><div id="list"><div class="head"><div class="ey">NEET · NCERT</div><div class="title">NCERT Questions</div><div class="sub">Select a chapter to open CBT Mode</div></div><div class="chapters"><div class="chapter" data-file="cbt.html"><b>Hydrocarbon</b><span>350 Questions · CBT Practice</span></div><div class="chapter" data-file="photosynthesis.html"><b>Photosynthesis</b><span>235 Questions · CBT Practice</span></div><div class="chapter" data-file="biomolecules.html"><b>Biomolecules</b><span>220 Questions · CBT Practice</span></div></div></div><div id="cbt" class="cbt"><button class="back" id="back">← Back to Chapters</button><div class="frame"><iframe id="frame" title="NCERT CBT"></iframe></div></div></div><script>const list=document.getElementById('list'),cbt=document.getElementById('cbt'),frame=document.getElementById('frame');document.querySelectorAll('.chapter').forEach(x=>x.onclick=()=>{frame.src=x.dataset.file+'?v=12';list.style.display='none';cbt.classList.add('show');window.scrollTo(0,0)});document.getElementById('back').onclick=()=>{frame.src='about:blank';cbt.classList.remove('show');list.style.display='block'};</script></body></html>
