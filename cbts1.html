let q=1,ans={},reviewed=new Set(),seconds=10800,submitted=false;
const $=id=>document.getElementById(id);
function render(){
 const c=CROPS[q], w=c[2]-c[1], h=c[4]-c[3];
 $("qn").textContent="Question "+q+" / 180";
 const paper=$("paper");
 paper.style.aspectRatio=w+"/"+h;
 paper.innerHTML=`<img src="${PAGES[c[0]]}" style="width:${(612/w*100).toFixed(4)}%;left:${(-c[1]/w*100).toFixed(4)}%;top:${(-c[3]/h*100).toFixed(4)}%;">`;
 $("status").textContent=ans[q]===undefined?"Not answered":(reviewed.has(q)?"Marked for Review":"Answered");
 document.querySelectorAll("#answers button").forEach(b=>b.classList.toggle("sel",ans[q]===+b.dataset.k));
 document.querySelectorAll("#palette button").forEach((b,i)=>{let n=i+1;b.className=(n===q?"cur ":"")+(ans[n]!==undefined?"done":"");});
}
function go(n){q=Math.max(1,Math.min(180,n));render();scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("#answers button").forEach(b=>b.onclick=()=>{if(!submitted){ans[q]=+b.dataset.k;render()}});
prev.onclick=()=>go(q-1);next.onclick=()=>go(q+1);clear.onclick=()=>{delete ans[q];render()};
review.onclick=()=>{reviewed.has(q)?reviewed.delete(q):reviewed.add(q);render()};
submit.onclick=()=>{submitted=true;alert("Test submitted.")};
