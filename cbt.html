velocity (V), and density (D) are treated as base quantities. Using these as fundamental units, the dimensional formula of linear momentum is to be expressed in terms of F, V, and D. Which of the following represents the correct dimensional formula?","options":[{"key":"A","text":"DVF2"},{"key":"B","text":"DV2F−1"},{"key":"C","text":"D2V2F2"},{"key":"D","text":"DV4F−3"}],"answer":"D"},{"id":13,"stem":"What is the unit of K = 1 4πε0 ?","options":[{"key":"A","text":"C2 N−1 m−2"},{"key":"B","text":"N m2 C−2"},{"key":"C","text":"N m2 C−1"},{"key":"D","text":"Unitless <PARSED TEXT FOR PAGE: 5 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"B"},{"id":14,"stem":"Which of the following statements are incorrect? 1) A vector is not changed if it is shifted parallel to itself 2) The component of a vector is always less than its magnitude 3) A vector is changed if it’s rotated to an arbitrary angle 4) The magnitude of a vector product of two vectors may be equal to AB, less than AB or equal to zero","options":[{"key":"A","text":"1, 2 and 3"},{"key":"B","text":"2, 3 and 4"},{"key":"C","text":"2 only"},{"key":"D","text":"3 & 4 only"}],"answer":"C"},{"id":15,"stem":"Find the resultant of the three vectors� 𝑂𝑂����⃗, � 𝑂𝑂����⃗ and 𝑂𝑂𝑂𝑂�����⃗ shown in figure. Radius of the circle is 𝑅𝑅:","options":[{"key":"A","text":"2R"},{"key":"B","text":"(2 + √2)R"},{"key":"C","text":"R"},{"key":"D","text":"R(1 + √2)"}],"answer":"B"},{"id":16,"stem":"A vector 𝐴𝐴⃗ points vertically downwards and 𝐵𝐵�⃗ points towards north. The vector product 𝐴𝐴⃗ × 𝐵𝐵�⃗ is:","options":[{"key":"A","text":"Zero"},{"key":"B","text":"Along west"},{"key":"C","text":"Along east"},{"key":"D","text":"Vertically downward"}],"answer":"C"},{"id":17,"stem":"Which of the following is a unitless quantity?","options":[{"key":"A","text":"Pressure gradient"},{"key":"B","text":"Velocity gradient"},{"key":"C","text":"Plane angle"},{"key":"D","text":"Displacement gradient"}],"answer":"C"},{"id":18,"stem":"In a physics lab, the diameter of a metallic rod is measured multiple times using a calibrated Vernier Calliper by four different interns. Their individual observations are recorded as: 4.4 mm, 4.6 mm, 5.4 mm, and 5.6 mm. Calculate the mean absolute error in the measurement.","options":[{"key":"A","text":"0 mm"},{"key":"B","text":"0.4 mm"},{"key":"C","text":"0.5 mm"},{"key":"D","text":"0.6 mm"}],"answer":"C"},{"id":19,"stem":"Particle's position as a function of time is given by 𝑥𝑥 = −𝑡𝑡2 + 4𝑡𝑡 + 4. Find the maximum value of position coordinate of the particle:","options":[{"key":"A","text":"9"},{"key":"B","text":"8"},{"key":"C","text":"10"},{"key":"D","text":"7"}],"answer":"B"},{"id":20,"stem":"Given a + b + c + d = 0, which of the following statements are correct: 1) a, b, c and d must each be a null vector. 2) The magnitude of (a + c) equals the magnitude of (b + d). 3) The magnitude of a can never be greater than the sum of the magnitudes of b, c, and d. 4) b + c must lie in the plane of a and d if a and d are not collinear, and in the line of a and d if they are collinear.","options":[{"key":"A","text":"2 & 3 only"},{"key":"B","text":"2, 3, 4"},{"key":"C","text":"1, 2, 3"},{"key":"D","text":"All of the above <PARSED TEXT FOR PAGE: 6 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"B"},{"id":21,"stem":"If |A��⃗ × B��⃗| = 4 and |A��⃗ ⋅ B��⃗| = 3, find the value of |A��⃗ + B��⃗|.","options":[{"key":"A","text":"�A2 + B2 + 8AB 5"},{"key":"B","text":"�A2 + B2 + 6AB 5"},{"key":"C","text":"�A2 + B2 − 8AB 5"},{"key":"D","text":"�A2 + B2 − 6AB 5"}],"answer":"B"},{"id":22,"stem":"The physical quantity which has dimensional formula as that of Energy mass×length is","options":[{"key":"A","text":"Force"},{"key":"B","text":"Power"},{"key":"C","text":"Pressure"},{"key":"D","text":"Acceleration"}],"answer":"D"},{"id":23,"stem":"A small lab drone exerts a force of 100 dyne on a sensor platform in the C.G.S. system. The data from the experiment needsto be converted into a system where the fundamental units are kilogram (kg), metre (m), and minute (min) instead of gram, centimetre, and second. What will be the numerical value of this force in the new system of units?","options":[{"key":"A","text":"0.036"},{"key":"B","text":"0.36"},{"key":"C","text":"3.6"},{"key":"D","text":"36"}],"answer":"C"},{"id":24,"stem":"Which one of the following is a dimensional constant?","options":[{"key":"A","text":"Refractive index"},{"key":"B","text":"Dielectric constant"},{"key":"C","text":"Relative density"},{"key":"D","text":"Gravitational constant"}],"answer":"D"},{"id":25,"stem":"A wire has a mass (0.3 ± 0.003) gm, radius (0.5 ± 0.005) mm and length (6 ± 0.06) cm. The percentage error in the measurement of density is","options":[{"key":"A","text":"2%"},{"key":"B","text":"3%"},{"key":"C","text":"4%"},{"key":"D","text":"5%"}],"answer":"C"},{"id":26,"stem":"If a�⃗ = 2ı̂+ 3ȷ̂+ 4k� and � b⃗ = 4ı̂+ 3ȷ̂+ 2k�, find the angle between a�⃗ and b�⃗.","options":[{"key":"A","text":"cos−1 � 25 29�"},{"key":"B","text":"cos−1 � 23 29�"},{"key":"C","text":"cos−1 � 25 31�"},{"key":"D","text":"cos−1 � 24 29�"}],"answer":"A"},{"id":27,"stem":"A physical quantity 𝑋𝑋 is defined by 𝑋𝑋 = 𝐴𝐴2√𝐵𝐵 2 and the percentage errors in the measurements of 𝐴𝐴, 𝐵𝐵, and are 1%, 2%, and 0.5% respectively. The maximum percentage error in calculation of 𝑋𝑋 is:","options":[{"key":"A","text":"2%"},{"key":"B","text":"4%"},{"key":"C","text":"3%"},{"key":"D","text":"6% <PARSED TEXT FOR PAGE: 7 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"B"},{"id":28,"stem":"Consider the following statements regarding two non-zero vectors A��⃗ and B��⃗: (I) If A��⃗ ⋅ B��⃗ = 0, then � A�⃗ and � B�⃗ must be perpendicular. (II) If � A�⃗ × B��⃗ = 0, then � A�⃗ and � B�⃗ are either parallel or antiparallel. (III) If two vectors are equal in magnitude and the resultant is equal to either of them, the angle between them must be 120∘ . (IV) The magnitude of the cross product |A��⃗ × B��⃗| is always less than or equal to the product |A��⃗||B��⃗|. (V) If A��⃗ ⋅ B��⃗ = |A��⃗||B��⃗|, then � A�⃗ and � B�⃗ are in the same direction. Which of the above statements are correct?","options":[{"key":"A","text":"I, II, III"},{"key":"B","text":"II, III, IV"},{"key":"C","text":"I, III, IV, V"},{"key":"D","text":"All of the above"}],"answer":"D"},{"id":29,"stem":"If dimensions of a physical quantity are given by MaLbTc, then the physical quantity will be","options":[{"key":"A","text":"Torque if a = 2, b = 1, c = −2"},{"key":"B","text":"Force if a = 1, b = 2, c = −1"},{"key":"C","text":"Strain if a = 0, b = 0, c = +1"},{"key":"D","text":"Stress if a = 1, b = −1, c = −2"}],"answer":"A"},{"id":30,"stem":"A force � F⃗ = ı̂ − 2ȷ̂+ 2k� acts at a point whose position vector is r⃗B = ı̂+ 4ȷ̂+ 2k�. The torque is to be calculated about a point C whose position vector is r⃗C = 3ı̂+ ȷ̂+ k�. Additionally, a third point A is located at r⃗A = 2ı̂+ 3ȷ̂ − k�. The torque due to this force about point C is best represented by which of the following?","options":[{"key":"A","text":"8ı̂+ 5ȷ̂+ k�"},{"key":"B","text":"6ı̂+ 4ȷ̂+ 3k�"},{"key":"C","text":"−8ı̂+ 5ȷ̂ − k�"},{"key":"D","text":"7ı̂ − 6ȷ̂+ 2k�"}],"answer":"A"},{"id":31,"stem":"The displacement of a progressive wave is represented by y = Asin(kx − ωt), where x is distance and t is time. The dimension of (ω/k) is same as those of:","options":[{"key":"A","text":"Angular wave number"},{"key":"B","text":"Frequency"},{"key":"C","text":"Amplitude"},{"key":"D","text":"Speed"}],"answer":"D"},{"id":32,"stem":"A drone experiences two forces: F�⃗ 1 = 2ı̂+ 1ȷ̂, F�⃗ 2 = aı̂+ 3ȷ̂. If the net force is perpendicular to v�⃗ = ı̂+ ȷ̂, find the value of a:","options":[{"key":"A","text":"-2"},{"key":"B","text":"-1"},{"key":"C","text":"-4"},{"key":"D","text":"-6"}],"answer":"D"},{"id":33,"stem":"Which of the following has dimensional formula same as time? (R = Resistance, L = Inductance, C = Capacitance)","options":[{"key":"A","text":"𝑅𝑅"},{"key":"B","text":"𝐿𝐿 𝑅𝑅"},{"key":"C","text":"√𝐿𝐿"},{"key":"D","text":"All of these <PARSED TEXT FOR PAGE: 8 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"D"},{"id":34,"stem":"While calculating acceleration due to gravity using a simple pendulum, a student employs the standard relation g = 4π2L T2 , where L is the length of the pendulum and T is its time period. The student records the length of the pendulum as 100.0 ± 0.2 cm and the time period for one complete oscillation as 2.00 ± 0.01 s. If the value of g calculated from these readings is 10 m/s2 , then select the incorrect option","options":[{"key":"A","text":"Absolute error in g: 0.12 m/s2"},{"key":"B","text":"Relative error: 0.014"},{"key":"C","text":"Percentage error: 1.2%"},{"key":"D","text":"Time measurement contributes more significantly to the error in g due to squaring of time in the denominator which amplifies the uncertainity"}],"answer":"B"},{"id":35,"stem":"To determine the diameter of a copper wire, a student uses a screw gauge that has 50 divisions on the circular scale. It is observed that a linear scale length of 1 mm is covered in one complete rotation of the circular scale. When the screw gauge is brought in contact with nothing, the 3rd division on the circular scale exactly coincides with the reference line. During measurement, the main scale reading is noted to be 3.5 mm and the 37th circular scale division coincides exactly with the reference line. Calculate the correct diameter of the wire","options":[{"key":"A","text":"4.30 mm"},{"key":"B","text":"4.24 mm"},{"key":"C","text":"4.18 mm"},{"key":"D","text":"4.12 mm"}],"answer":"C"},{"id":36,"stem":"Which of the following statements is/are correct regarding types of experimental errors A. Fluctuations in ambient temperature and voltage supply during repeated trials of an experiment introduce random errors, which cannot be predicted precisely. B. Instrumental errors arise only due to faulty handling of devices by the observer. C. Least count errors can be minimized using devices with higher precision or by repeating measurements and averaging. D. Personal errors occur due to biases or limitations of human perception and are thus systematic in nature","options":[{"key":"A","text":"A, C, and D"},{"key":"B","text":"A and C only"},{"key":"C","text":"B and D only"},{"key":"D","text":"A, B, and C"}],"answer":"A"},{"id":37,"stem":"Suggest suitable match between function given in the first column and its description given in the second column. Column-I Column-II (A) sin (390°) (P) Positive (B) sin (–30°) (Q) Negative (C) cos 120° (R) Zero (D) tan (–120°) (S) Modulus is greater than one","options":[{"key":"A","text":"(A) → Q, (B) → P, (C) → P, (D) → Q, S"},{"key":"B","text":"(A) → P, (B) → Q, (C) → Q, (D) → P, S"},{"key":"C","text":"(A) → P, (B) → Q, (C) → P, (D) → P, S"},{"key":"D","text":"(A) → Q, (B) → P, (C) → Q, (D) → Q, S <PARSED TEXT FOR PAGE: 9 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":38,"stem":"Figure shows graph and slope relationship: List-I List-II (P) (1) Positive (Q) (2) Negative (R) (3) Zero (S) (4) Cannot be defined","options":[{"key":"A","text":"P → 2; Q → 1; R → 3; S → 1"},{"key":"B","text":"P → 1; Q → 3; R → 1; S → 2"},{"key":"C","text":"P → 2; Q → 3; R → 1; S → 1"},{"key":"D","text":"P → 1; Q → 2; R → 3; S → 1"}],"answer":"D"},{"id":39,"stem":"A screw gauge has least count of 0.02 mm and there are 100 divisions on its circular scale. The pitch of the screw gauge is:","options":[{"key":"A","text":"0.02 mm"},{"key":"B","text":"0.01 mm"},{"key":"C","text":"2 mm"},{"key":"D","text":"1.0 mm"}],"answer":"C"},{"id":40,"stem":"Some physical constants are given in column I and their dimensional formulae are given in column II. Match the correct pairs in the columns Column I Column II A. Gravitational constant (P) [ML2T−1] B. Stefan’s constant (Q) [ML0T−3K−4] C. Boltzmann’s constant (R) [M−1L3T−2] D. Planck’s constant (S) [ML2T−2K−1]","options":[{"key":"A","text":"A→ (R), B→ (S), C→ (Q), D→ (P)"},{"key":"B","text":"A→ (P), B→ (Q), C→ (R), D→ (S)"},{"key":"C","text":"A→ (R), B→ (Q), C→ (S), D→ (P)"},{"key":"D","text":"A→ (Q), B→ (R), C→ (P), D→ (S)"}],"answer":"C"},{"id":41,"stem":"Find out the true value in the above vernier callipers observation. (1 main scale division = 1 mm, Least count = 0.1 mm, Zero error = 0.2 mm)","options":[{"key":"A","text":"6.5 mm"},{"key":"B","text":"6.7 mm"},{"key":"C","text":"6.3 mm"},{"key":"D","text":"7.5 mm <PARSED TEXT FOR PAGE: 10 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"A"},{"id":42,"stem":"Statement 1: The addition of lengths 100 m and 0.2 m up to appropriate significant figure will be 100 Statement 2: Each side of a cube is measured to be 2.32 m. The total surface area of the cube with appropriate significant figure will be 32.294 m2","options":[{"key":"A","text":"Statement 1 is correct & Statement 2 is incorrect"},{"key":"B","text":"Statement 2 is correct & Statement 1 is incorrect"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"A"},{"id":43,"stem":"Diameter of a steel ball is measured using a vernier callipers which has divisions of 0.1 cm on its main scale (MS) and 10 divisions of its vernier scale (VS) match 9 divisions on the main scale. Three such measurements for a ball are given as: S.No. MS (cm) VS divisions 1 0.5 8 2 0.5 4 3 0.5 6 If the zero error is −0.03 cm, then mean corrected diameter is:","options":[{"key":"A","text":"0.53 cm"},{"key":"B","text":"0.56 cm"},{"key":"C","text":"0.59 cm"},{"key":"D","text":"0.52 cm"}],"answer":"C"},{"id":44,"stem":"A student is using a Vernier caliper to measure the diameter of a small metallic sphere. The main scale of the instrument is in centimeters, and 10 divisions on the Vernier scale are equal in length to 9 divisions on the main scale. When the jaws are completely closed, the zero of the Vernier scale lies 0.04 cm below the main scale zero. During the measurement, the student observes that the zero of the Vernier scale lies just beyond the 2.3 cm mark on the main scale, and the 7th division of the Vernierscale exactly coincides with a main scale division. Determine the accurate diameter of the sphere","options":[{"key":"A","text":"2.33 cm"},{"key":"B","text":"2.37 cm"},{"key":"C","text":"2.41 cm"},{"key":"D","text":"2.45 cm"}],"answer":"C"},{"id":45,"stem":"Two vectors P and Q, each having magnitude R, are inclined to each othersuch that their resultant is √3R. Then the resultant of vector P and –Q will be:","options":[{"key":"A","text":"√3R"},{"key":"B","text":"2R"},{"key":"C","text":"R"},{"key":"D","text":"Zero <PARSED TEXT FOR PAGE: 11 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":46,"stem":"A solution oftwo components containing n1 moles of the 1st component and n2 moles of the 2nd component is prepared. M1 and M2 are the molecular weights of component 1 and 2 respectively. If d is the density of the solution in g mL−1, C2 is the molarity and x2 is the mole fraction of the 2nd component, then C2 can be expressed as:","options":[{"key":"A","text":"C2 = 1000 x2 M1+x2(M2−M1)"},{"key":"B","text":"C2 = d x2 M2+x2(M2−M1)"},{"key":"C","text":"C2 = 1000 d x2 M1+x2(M2−M1)"},{"key":"D","text":"C2 = d x1 M2+x2(M2−M1)"}],"answer":"C"},{"id":47,"stem":"Match the column I with column II: Column I (Amount of substance) Column II (Number of oxygen atoms) (A) 98 mg H₂SO₄ (P) 2 Nₐ (B) 18 g water (Q) 2 × 10⁻³ Nₐ (C) 60 g NO gas (R) 4 × 10⁻³ Nₐ (D) 44.8 mL of CO₂ gas at 0.5 atm & 273 K (S) Nₐ","options":[{"key":"A","text":"A → P, B → Q, C → R, D → S"},{"key":"B","text":"A → P, B → S, C → R, D → Q"},{"key":"C","text":"A → R, B → S, C → P, D → Q"},{"key":"D","text":"A → R, B → S, C → Q, D → P"}],"answer":"C"},{"id":48,"stem":"An element X has three isotopes, 144X, 142X, 146X. The weighted average atomic mass of element X is experimentally found to be 144.4 u. If two isotopes 144X and 146X are present in equal abundance, then determine the percentage composition of each isotope.","options":[{"key":"A","text":"142X = 20 %, 144X = 40 %, 146X = 40 %"},{"key":"B","text":"142X = 30 %, 144X = 35 %, 146X = 35 %"},{"key":"C","text":"142X = 10 %, 144X = 45%, 146X = 45%"},{"key":"D","text":"142X = 25 %, 144X = 37.5 %, 146X = 37.5 %"}],"answer":"A"},{"id":49,"stem":"Number of molecules of glucose present in 400 mL of 1 M glucose solution is:","options":[{"key":"A","text":"3.01 × 1021"},{"key":"B","text":"6.02 × 1023"},{"key":"C","text":"1.2 × 1022"},{"key":"D","text":"2.4 × 1023"}],"answer":"D"},{"id":50,"stem":"A solution is prepared by mixing 0.45 N hydrochloric acid (HCl) and 0.60 N sodium hydroxide (NaOH) in the volume ratio 2:1, respectively. What will be the normality of the resulting solution?","options":[{"key":"A","text":"0.10 N"},{"key":"B","text":"0.15 N"},{"key":"C","text":"0.20 N"},{"key":"D","text":"0.25 N <PARSED TEXT FOR PAGE: 12 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"A"},{"id":51,"stem":"Match Column I with Column II","options":[{"key":"A","text":"a-p; b-r; c-q; d-s"},{"key":"B","text":"a-q; b-p; c-q; d-r"},{"key":"C","text":"a-r; b-p; c-q; d-s"},{"key":"D","text":"a-r; b-s; c-q; d-p"}],"answer":"A"},{"id":52,"stem":"If it is known that in Fe0.96O, Fe is present in +2 and +3 oxidation states, what is the mole fraction of Fe2+ among the iron cations?","options":[{"key":"A","text":"12 25"},{"key":"B","text":"25 12"},{"key":"C","text":"1 12"},{"key":"D","text":"11 12"}],"answer":"A"},{"id":53,"stem":"H₂O₂ is used as a bleaching reagent because on dissociation it gives oxygen: (H2O2 → H2O + 1 2 O2) If “Chachi 420” used H₂O₂ solution to bleach her hair and she required 2.24 L O2 gas at 1 atm and 273 K. She has a H₂O₂ solution labelled as 5.6 V, then what volume of such solution must she require to bleach her hair?","options":[{"key":"A","text":"200 mL"},{"key":"B","text":"300 mL"},{"key":"C","text":"400 mL"},{"key":"D","text":"500 mL"}],"answer":"C"},{"id":54,"stem":"Elements A and B form two compounds, AB3 and AB5. A sample of 0.20 mol of AB3 has a mass of 8 g, while 0.10 mol of AB5 has a mass of 5 g. Determine the percentage by mass of element B in compound AB5.","options":[{"key":"A","text":"40 %"},{"key":"B","text":"45 %"},{"key":"C","text":"50 %"},{"key":"D","text":"60 % Column I Column II"}],"answer":"C"},{"id":55,"stem":"A novel pollutant degrading enzyme is engineered to bind exactly two Na+ ions per polypeptide. Elemental analysis shows sodium consitutes 1.00 % of the enzyme’s mass. The minimum molar mass of this enzyme will be","options":[{"key":"A","text":"2,300 g mol-1"},{"key":"B","text":"4,600 g mol-1"},{"key":"C","text":"46000 g mol-1"},{"key":"D","text":"9,200 g mol-1"}],"answer":"B"},{"id":56,"stem":"3 students try to measure the molar mass of H2 and each of them reported 2 results as follows: Measurements 1 2 Student A 1.95 1.93 Student B 1.94 2.05 Student C 2.01 1.99 Statement 1- Results of student C were both accurate and precise Statement 2- Least precise values were reported by student A","options":[{"key":"A","text":"Statement 1 is correct; Statement 2 is incorrect"},{"key":"B","text":"Statement 1 is incorrect; Statement 2 is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"A"},{"id":57,"stem":"What moles of air are required at 0∘C and 1 atm to completely burn 87 g butane (C4H10)? (Given: Air contains 20% oxygen by volume)","options":[{"key":"A","text":"4.875 mol"},{"key":"B","text":"48.75 mol"},{"key":"C","text":"97.5 mol"},{"key":"D","text":"9.75 mol"}],"answer":"B"},{"id":58,"stem":"Which among the following contains lowest number of molecules?","options":[{"key":"A","text":"22.4 L of CH4 at STP"},{"key":"B","text":"2 g molecule of N2"},{"key":"C","text":"34.2 g of sugar (C12H22O11)"},{"key":"D","text":"18 mL of H2O (density of water = 1 g/mL)"}],"answer":"C"},{"id":59,"stem":"A student calculates the density of a substance as 1.734 g/cm3 , where mass and volume were taken as 4.335 g and 2.5 cm3 respectively. Based on the above observation, the following statements are given Statement 1- The final answer should be reported as 1.7 g/cm3 because the volume has only one digit after the decimal Statement 2- If the value were 1.735 then it would be rounded up to 1.8 g/cm3 because 3 is odd","options":[{"key":"A","text":"Statement 1 is correct; Statement 2 is incorrect"},{"key":"B","text":"Statement 1 is incorrect; Statement 2 is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect <PARSED TEXT FOR PAGE: 14 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"A"},{"id":60,"stem":"A student calculates an unknown physical quantity 𝑅𝑅 using the following expression: R = (A − B)C D Where A, B, C and D are 29.2, 20.2, 1.79 × 105 and 1.37 respectively. The number of significant figures in the unknown physical quantity will be:","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"B"},{"id":61,"stem":"In the reaction, 4NH₃(g) + 5O₂(g) → 4NO(g) + 6H₂O(l) When 1 mole of ammonia reacts with 2 moles of oxygen, number of moles of water formed is:","options":[{"key":"A","text":"1 mole"},{"key":"B","text":"1.2 mole"},{"key":"C","text":"1.5 mole"},{"key":"D","text":"2 mole"}],"answer":"C"},{"id":62,"stem":"If volume occupied by 16 g gas at 0°C and 1 atm pressure is 5.6 L then the gas should be","options":[{"key":"A","text":"CH₄"},{"key":"B","text":"O₂"},{"key":"C","text":"SO₂"},{"key":"D","text":"SO₃"}],"answer":"B"},{"id":63,"stem":"An organic compound contains C, H and N, where mass fractions of C and H are 0.679 and 0.057 respectively. If the molar mass of the compound is found to be 106 g mol-1, then its molecular formula is","options":[{"key":"A","text":"C₃H₃N"},{"key":"B","text":"C₆H₆N₂"},{"key":"C","text":"C₉H₉N₃"},{"key":"D","text":"CH₃N"}],"answer":"B"},{"id":64,"stem":"200 ml of 𝑁𝑁 10 H₂SO₄ is mixed with 100 ml of 𝑁𝑁 5 H₂SO₄ and the volume of solution is made to one litre. The molarity of the resulting H₂SO₄ solution will be","options":[{"key":"A","text":"0.04 M"},{"key":"B","text":"0.01 M"},{"key":"C","text":"0.02 M"},{"key":"D","text":"0.05 M"}],"answer":"C"},{"id":65,"stem":"107 g of an ammonium chloride sample decomposes on heating to give HCl(g) and 25.5 g of NH₃(g). The percentage purity of ammonium chloride sample is","options":[{"key":"A","text":"81.78%"},{"key":"B","text":"95.21%"},{"key":"C","text":"75%"},{"key":"D","text":"90.2%"}],"answer":"C"},{"id":66,"stem":"Choose the incorrect statement","options":[{"key":"A","text":"Azidothymidine is used in the treatment of AIDS patients"},{"key":"B","text":"Cisplatin and Taxol are used to inhibit the growth of cancer cells"},{"key":"C","text":"CFCs lead to the depletion of ozone layer in mesosphere"},{"key":"D","text":"Property of mixture is same as that of the constituent components"}],"answer":"C"},{"id":67,"stem":"Calculate the molality of 1 litre solution of 93% H₂SO₄ (weight/volume). The density of the solution is 1.84 g/mL.","options":[{"key":"A","text":"17.4 m"},{"key":"B","text":"13.2 m"},{"key":"C","text":"10.4 m"},{"key":"D","text":"21.6 m <PARSED TEXT FOR PAGE: 15 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":68,"stem":"Volume at N.T.P. of 0.22 g of CO₂ is same as that of","options":[{"key":"A","text":"0.01 g of hydrogen"},{"key":"B","text":"0.085 g of NH₃"},{"key":"C","text":"320 mg of gaseous SO₂"},{"key":"D","text":"All the above"}],"answer":"D"},{"id":69,"stem":"5 L of an alkane requires 25 L of oxygen for its complete combustion. If all volumes are measured at constant temperature and pressure, the alkane is:","options":[{"key":"A","text":"Isobutane"},{"key":"B","text":"Ethane"},{"key":"C","text":"Butane"},{"key":"D","text":"Propane"}],"answer":"D"},{"id":70,"stem":"500 cm³ of 0.01 M NaCl aqueous solution is added to 100 cm³ of 0.05 M aqueous AgNO₃ solution. What is the mass of the precipitate formed? (Ag = 108, Cl = 35.5)","options":[{"key":"A","text":"2.35 g"},{"key":"B","text":"1.73 g"},{"key":"C","text":"0.717 g"},{"key":"D","text":"0.036 g"}],"answer":"C"},{"id":71,"stem":"Two gaseous samples, methane (CH₄) and sulphur dioxide (SO₂), the masses taken are in the ratio 2:5. On this basis, determine the ratio of the total number of atoms present in the methane sample to that in the sulphur dioxide sample","options":[{"key":"A","text":"4:5"},{"key":"B","text":"8:5"},{"key":"C","text":"5:3"},{"key":"D","text":"8:3"}],"answer":"D"},{"id":72,"stem":"A gaseous hydrocarbon was burnt in excess of oxygen. At STP, 0.112 L hydrocarbon gave 0.88 g of CO₂. How many C-atoms are there in one molecule of hydrocarbon?","options":[{"key":"A","text":"4"},{"key":"B","text":"1"},{"key":"C","text":"2"},{"key":"D","text":"3"}],"answer":"A"},{"id":73,"stem":"Volume of CO₂ obtained at STP by the complete decomposition of 8.4 g of MgCO₃ (90% pure) at STP will be","options":[{"key":"A","text":"2.02 L"},{"key":"B","text":"1.46 L"},{"key":"C","text":"2.91 L"},{"key":"D","text":"3.42 L"}],"answer":"A"},{"id":74,"stem":"Molarity of H₂SO₄ solution is 18 M. The molality of this H₂SO₄ solution is (density of solution = 1.8 g mL⁻¹):","options":[{"key":"A","text":"36"},{"key":"B","text":"200"},{"key":"C","text":"500"},{"key":"D","text":"18 <PARSED TEXT FOR PAGE: 16 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":75,"stem":"20 g of calcium carbide (CaC₂) and 10 g of calcium carbonate (CaCO₃) are treated with excess dilute HCl at 298 K and 1 atm as shown. The gaseous products produced are bubbled through concentrated KOH, then what what volume of gas remains unabsorbed at STP. CaC₂ + 2 HCl → CaCl₂ + C₂H₂↑ CaCO₃ + 2 HCl → CaCl₂ + CO₂↑ + H₂O","options":[{"key":"A","text":"3 L"},{"key":"B","text":"5 L"},{"key":"C","text":"7 L"},{"key":"D","text":"10 L"}],"answer":"C"},{"id":76,"stem":"Which of the following statement/s is/are incorrect with respect to Dalton’s atomic theory 1) Matter consists of indivisible atoms 2) Compounds are formed when atoms of same or different elements combine in a fixed ratio 3) It explained all the laws of chemical combination and gases volumes 4) Atoms are neither created nor destroyed in a chemical reaction Choose the correct option","options":[{"key":"A","text":"2, 3, 4"},{"key":"B","text":"3 only"},{"key":"C","text":"2 and 3"},{"key":"D","text":"1, 2 and 3"}],"answer":"B"},{"id":77,"stem":"A 100 mL solution was made by adding 1.43 g of Na₂CO₃·xH₂O. The normality of the solution is 0.1 N. The value of x is","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"},{"key":"D","text":"20"}],"answer":"B"},{"id":78,"stem":"50 mL of 20.8% (w/V) BaCl₂ (aq) and 100 mL of 9.8% (w/V) H₂SO₄ (aq) solutions are mixed. Molarity of Cl⁻ ions in the resulting solution is: (At. wt. of Ba = 137)","options":[{"key":"A","text":"0.333 M"},{"key":"B","text":"0.666 M"},{"key":"C","text":"0.1 M"},{"key":"D","text":"1.33 M"}],"answer":"B"},{"id":79,"stem":"A sample of NaClO₃ is converted by heat to NaCl with a loss of 0.16 g of oxygen. The residue is dissolved in water and precipitated as AgCl by adding AgNO3. The moles of AgCl obtained will be: (Given: Molar mass of AgCl = 143.5 g mol⁻¹)","options":[{"key":"A","text":"6.6 x 10-3"},{"key":"B","text":"4.5 x 10-3"},{"key":"C","text":"2.5 x 10-3"},{"key":"D","text":"3.3 x 10-3"}],"answer":"D"},{"id":80,"stem":"A buffer is prepared by mixing 50 ml of 0.500 M Na2CO3 with X ml of 0.750 M HCl at 37° C. After the reaction completes, exactly 25 % of the original Na2CO3 (by moles) is left unreacted. What will be the value of X","options":[{"key":"A","text":"25 ml"},{"key":"B","text":"37 ml"},{"key":"C","text":"50 ml"},{"key":"D","text":"75 ml"}],"answer":"C"},{"id":81,"stem":"An unknown chlorohydrocarbon has 3.55% of chlorine. If each molecule of the hydrocarbon has one chlorine atom only, chlorine atoms present in 1 g of chlorohydrocarbon are: (Atomic wt. of Cl = 35.5 u; Avogadro constant = 6.023 × 10²³ mol⁻¹)","options":[{"key":"A","text":"6.023 × 10⁹"},{"key":"B","text":"6.023 × 10²³"},{"key":"C","text":"6.023 × 10²¹"},{"key":"D","text":"6.023 × 10²⁰ <PARSED TEXT FOR PAGE: 17 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"D"},{"id":82,"stem":"10 L of hydrogen gas containing an inert impurity and 20 L of pure chlorine gas are allowed to react completely atthe same temperature and pressure to form hydrogen chloride: H2(g) + Cl2(g) → 2HCl(g) After the reaction is complete, analysis of the gaseous mixture shows 12 L of chlorine, 16 L of hydrogen chloride and 2 L of the inert gas. Percentage purity (by volume) of the original hydrogen sample will be","options":[{"key":"A","text":"80%"},{"key":"B","text":"70%"},{"key":"C","text":"60%"},{"key":"D","text":"90%"}],"answer":"A"},{"id":83,"stem":"The total number of electrons and valence electrons present in 9.6 g of SO4 2- ion is","options":[{"key":"A","text":"5 NA, 3 NA"},{"key":"B","text":"0.5 NA, 1.6 NA"},{"key":"C","text":"5 NA, 3.2 NA"},{"key":"D","text":"4.8 NA, 3.2 NA"}],"answer":"C"},{"id":84,"stem":"Choose the incorrect statement/s 1) Candela is the unit of luminous intensity 2) Temperature below 0 are possible in both celcius and kelvin scale 3) In 20 eggs, 20 has 1 significant figure 4) Avogadro proposed that equal volume of all gases at the same temperature and pressure should contain equal number of atoms","options":[{"key":"A","text":"2, 3, 4"},{"key":"B","text":"2 and 3 only"},{"key":"C","text":"3 only"},{"key":"D","text":"All of the above"}],"answer":"A"},{"id":85,"stem":"6.023 × 10²² molecules are present in 10 g of a substance 'x'. The molarity of a solution containing 5 g of substance 'x' in 2 L solution is","options":[{"key":"A","text":"12.5 × 10⁻³ M"},{"key":"B","text":"25 × 10⁻³ M"},{"key":"C","text":"5 × 10⁻³ M"},{"key":"D","text":"50 × 10⁻³ M"}],"answer":"B"},{"id":86,"stem":"What percentage of oxygen is present in the compound CaCO₃·3Ca₃(PO₄)₂?","options":[{"key":"A","text":"23.3%"},{"key":"B","text":"45.36%"},{"key":"C","text":"41.94%"},{"key":"D","text":"17.08%"}],"answer":"C"},{"id":87,"stem":"In the reaction, 4A + 2B + 3C → A₄B₂C₃, what will be the number of moles of product formed, starting from 1 mol of A, 0.6 mol of B and 0.72 mol of C:","options":[{"key":"A","text":"0.25"},{"key":"B","text":"0.3"},{"key":"C","text":"0.24"},{"key":"D","text":"2.32"}],"answer":"C"},{"id":88,"stem":"If concentrated aqueous H₂SO₄ is 98% by mass and its density is 1.7 g mL⁻¹, then the volume of acid required to make 2500 mL of 0.5 M H₂SO₄ solution will be","options":[{"key":"A","text":"125.2 mL"},{"key":"B","text":"51.7 mL"},{"key":"C","text":"89.2 mL"},{"key":"D","text":"73.5 mL"}],"answer":"D"},{"id":89,"stem":"1 L of pond water contains 20 mg of Ca²⁺ and 12 mg of Mg²⁺ ions. What is the volume of a 2 N Na₂CO₃ solution required to soften 5000 L of pond water?","options":[{"key":"A","text":"500 L"},{"key":"B","text":"50 L"},{"key":"C","text":"5 L"},{"key":"D","text":"None of these"}],"answer":"D"},{"id":90,"stem":"If 0.50 mole of BaCl₂ is mixed with 0.20 mol of Na₃PO₄, the maximum number of moles of Ba₃(PO₄)₂ that can be formed is","options":[{"key":"A","text":"0.70"},{"key":"B","text":"0.50"},{"key":"C","text":"0.20"},{"key":"D","text":"0.10"}],"answer":"D"},{"id":91,"stem":"Given below are two statements: One is labelled as Assertion (A) and the other is labelled as Reason (R) Assertion: The basic requirement to place an organism in various categories is comparitive study of all identified species Reason: Identifying similarities and dissimilarities among the individuals of the same or different kinds of organism helps in classification In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"A"},{"id":92,"stem":"Given below are two statements: Statement 1: Cat and dog have many dissimilarities and no similarity Statement 2: They are separated into 2 diffferent families, canidae and felidae respectively In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Statement 1 is correct, statement 2 is incorrect"},{"key":"B","text":"Statement 1 is incorrect, statement 2 is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"B"},{"id":93,"stem":"Which of the following statements about classification is not true? I. Members of a family are less similar than members of an included genus. II. An order has more members than the number of members in an included genus. III. Families have more members than phyla. IV. The number of species in a taxon depends on their relative degree of similarity.","options":[{"key":"A","text":"Only III"},{"key":"B","text":"Only IV"},{"key":"C","text":"Only II"},{"key":"D","text":"Only I"}],"answer":"A"},{"id":94,"stem":"Statement 1: The body of hydra is made of different types of cells and the number of cells in each type can be in thousands. Statement 2: A group of similar cells along with intercellular substance which perform a specific function is known as tissue. In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Statement 1 is correct, statement 2 is incorrect"},{"key":"B","text":"Statement 1 is incorrect, statement 2 is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"C"},{"id":95,"stem":"Which of the following is not a correct statement for neuroglial cell?","options":[{"key":"A","text":"Neuroglial cells make up more than one half the volume of neural tissue in our body"},{"key":"B","text":"It protects and supports the neurons"},{"key":"C","text":"When this cell is suitably stimulated, an electrical disturbance is generated which swiftly travels along its plasma membrane"},{"key":"D","text":"All the above options are correct <PARSED TEXT FOR PAGE: 19 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":96,"stem":"In frog, summer sleep is called","options":[{"key":"A","text":"Aestivation"},{"key":"B","text":"Hibernation"},{"key":"C","text":"Camouflage"},{"key":"D","text":"Mimicry"}],"answer":"A"},{"id":97,"stem":"Match the following and choose the correct option: Column I Column II A. Family i. tuberosum B. Kingdom ii. Polemoniales C. Order iii. Solanum D. Species iv. Plantae E. Genus v. Solanacea","options":[{"key":"A","text":"i → D, ii → C, iii → E, iv → B, v → A"},{"key":"B","text":"i → E, ii → D, iii → B, iv → A, v → C"},{"key":"C","text":"i → D, ii → E, iii → B, iv → A, v → C"},{"key":"D","text":"i → E, ii → C, iii → B, iv → A, v → D"}],"answer":"A"},{"id":98,"stem":"Match Column-I with Column-II and choose the correct option Column-I Column-II a. Fibroblasts (i) Phagocytic cells b. Macrophages (ii) Produce collagen fibres c. Adipocytes (iii) Store fats (iv) Present in blood","options":[{"key":"A","text":"a(iii), b(i), c(iv)"},{"key":"B","text":"a(i), b(ii), c(iii)"},{"key":"C","text":"a(ii), b(i), c(iii)"},{"key":"D","text":"a(i), b(iv), c(ii)"}],"answer":"C"},{"id":99,"stem":"Respiratory system of cockroach consists of a network of (A) that open through (B) spiracles. Identify A and B respectively from given options:","options":[{"key":"A","text":"A - Book lungs, B - 12 pairs"},{"key":"B","text":"A - Trachea, B - 10 pairs"},{"key":"C","text":"A - Trachea, B - 12 pairs"},{"key":"D","text":"A - Pulmonary sac, B - 10 pairs"}],"answer":"D"},{"id":100,"stem":"Which of the following category will show maximum difficulty in determining the relationship to other taxa at the same level","options":[{"key":"A","text":"Species"},{"key":"B","text":"Order"},{"key":"C","text":"Family"},{"key":"D","text":"Class"}],"answer":"A"},{"id":101,"stem":"Mangifera indica Linn. is the scientific name of mango where Linn. Indicates","options":[{"key":"A","text":"It was described by Linnaeus"},{"key":"B","text":"It is the local name of the species"},{"key":"C","text":"It refers to the location where it was first found"},{"key":"D","text":"It is the variety name of the plant"}],"answer":"A"},{"id":102,"stem":"Given below are two statements: One is labelled as Assertion (A) and the other is labelled as Reason (R) Assertion (A): Compound epithelium has a limited role in both secretion and absorption. Reason (R): Their main function is to provide protection against chemical and mechanical stresses.","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"A"},{"id":103,"stem":"Read the properties given in the box below: Excitability, Elasticity, Uninucleated, Presence of intercalated discs, long refractory period These properties can be associated with muscle fibres present in which location?","options":[{"key":"A","text":"Triceps"},{"key":"B","text":"Lungs"},{"key":"C","text":"Heart"},{"key":"D","text":"Wall of stomach <PARSED TEXT FOR PAGE: 20 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":104,"stem":"Arrange the following structures in the correct sequence for the passage of sperms in male frogs. A. Testes B. Cloaca C. Vasa efferentia D. Urinogenital duct E. Kidney F. Bidder’s canal Select the correct option:","options":[{"key":"A","text":"A → C → F → E → B→ D"},{"key":"B","text":"A → C → E → F → D → B"},{"key":"C","text":"A → F → C → E → D → B"},{"key":"D","text":"F → A → C → E → D → B"}],"answer":"A"},{"id":105,"stem":"How many ova laying at a time by mature female frog?","options":[{"key":"A","text":"2500–3000"},{"key":"B","text":"3000–4000"},{"key":"C","text":"4000–5000"},{"key":"D","text":"6000–7000"}],"answer":"A"},{"id":106,"stem":"Which of the following system in frog are well developed","options":[{"key":"A","text":"Vascular system"},{"key":"B","text":"Excretory system"},{"key":"C","text":"System of control and coordination"},{"key":"D","text":"All of the above"}],"answer":"D"},{"id":107,"stem":"Assertion: On an average, female cockroach produces 9-10 ootheca. Reason: Development in cockroach is paurometabolous.","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"B"},{"id":108,"stem":"Choose the correct location of tissue w.r.t. given diagram:","options":[{"key":"A","text":"PCT of nephron"},{"key":"B","text":"Blood vessels"},{"key":"C","text":"Air sacs of lungs"},{"key":"D","text":"Covers the dry surface of skin"}],"answer":"D"},{"id":109,"stem":"How many of the following are identified based on the aggregates of characters Order, species, phylum, class, genus, family, kingdom","options":[{"key":"A","text":"Seven"},{"key":"B","text":"Four"},{"key":"C","text":"Three"},{"key":"D","text":"Two"}],"answer":"A"},{"id":110,"stem":"Which of the following statements is incorrect 1. Classification is not a single step process 2. Each step of classification is known as a taxon 3. Earliest classifications were based on the external structure of various organisms 4. Taxonomical studies of all known organisms have led to the development of 7 categories","options":[{"key":"A","text":"1, 2 and 3"},{"key":"B","text":"3 only"},{"key":"C","text":"2, 3 and 4"},{"key":"D","text":"2 and 3"}],"answer":"D"},{"id":111,"stem":"ICBN stands for:","options":[{"key":"A","text":"Indian Council for Biological Nomenclature"},{"key":"B","text":"International Code for Binomial Nomenclature"},{"key":"C","text":"Indian Council for Binomial Nomenclature"},{"key":"D","text":"International Code for Botanical Nomenclature <PARSED TEXT FOR PAGE: 21 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"D"},{"id":112,"stem":"Read the following statements and choose the correct option. Statement-A: Adhering junctions perform cementing to keep neighbouring cells together. Statement-B: Tight junctions facilitate the cells to communicate with each other by connecting the cytoplasm of adjoining cells, for rapid transfer of ions, small molecules and sometimes big molecules.","options":[{"key":"A","text":"Only statement A is correct"},{"key":"B","text":"Only statement B is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"A"},{"id":113,"stem":"Consider the following statements about the reproductive system of a male frog and choose the correct option: I: The male frog has a pair of testes which are attached to the kidneys by a structure called mesorchium. II: The male frog's sperm travels through the urethra which also carries urine. III: External fertilization occurs, and the frog's sperm are released directly into the surrounding water.","options":[{"key":"A","text":"Only I and II are correct"},{"key":"B","text":"Only I and III are correct"},{"key":"C","text":"Only II and III are correct"},{"key":"D","text":"All statements are correct"}],"answer":"B"},{"id":114,"stem":"Statement 1: Frogs have simple eye unlike compound eye in human Statement 2: A nictitating membrane provides protection to the eye, especially when the frog is swimming In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Statement 1 is correct, statement 2 is incorrect"},{"key":"B","text":"Statement 1 is incorrect, statement 2 is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"C"},{"id":115,"stem":"Match the following columns with reference to cockroach and select the correct option: Column I Column II","options":[{"key":"A","text":"Grinding of the food particles (i) Hepatic caeca"},{"key":"B","text":"Secrete gastric juice (ii) 10th segment"},{"key":"C","text":"Boat shaped (iii) Proventriculus"},{"key":"D","text":"Anal cerci (iv) 7th Sternum (v) Alary muscles"}],"answer":"A"},{"id":116,"stem":"See the diagram carefully & identify the lower lip:","options":[{"key":"A","text":"P"},{"key":"B","text":"Q"},{"key":"C","text":"R"},{"key":"D","text":"S"}],"answer":"C"},{"id":117,"stem":"Given below are two statements: One is labelled as Assertion (A) and the other is labelled as Reason (R) Assertion (A): The kind of vision in cockroach is said to be mosaic Reason (R): Each compound eye of cockroach is made up of about 2000 hexagonal ommatidia, each of which is capable of forming a separate image. In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true <PARSED TEXT FOR PAGE: 22 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"A"},{"id":118,"stem":"All of the given features are incorrect w.r.t. frogs 1) The forelimbs and hindlimbs help in leaping only. 2) The hindlimbs are larger and muscular than forelimbs that end in four digits. 3) Frogs are not seen during peak summer and winter because of their ability to change color to hide. 4) Frogs can live both on land and in marine water.","options":[{"key":"A","text":"1 and 4 only"},{"key":"B","text":"2, 3 and 4"},{"key":"C","text":"1, 3 and 4"},{"key":"D","text":"1, 2 and 3"}],"answer":"D"},{"id":119,"stem":"Match the following: Column I Column II a) Wheat p) Primata b) Mango q) Insecta c) Hominidae r) Sapindales d) Diptera s) Poales","options":[{"key":"A","text":"a–s, b–r, c–p, d–q"},{"key":"B","text":"a–p, b–s, c–r, d–q"},{"key":"C","text":"a–s, b–q, c–p, d–r"},{"key":"D","text":"a–r, b–p, c–q, d–s"}],"answer":"A"},{"id":120,"stem":"State True (T) or False (F) to the following statements and choose the correct option A. All organisms from prokaryotes to the complex eukaryotes can sense various changes up to variable degrees in their surroundings. B. All properties of tissues are present in their constituent cells. C. Consciousness is the most obvious and technically complicated feature of all living organisms. D. Increase in mass and increase in number of cells are twin characteristics of growth in living organism.","options":[{"key":"A","text":"A–T, B–F, C–T, D–F"},{"key":"B","text":"A–F, B–T, C–T, D–F"},{"key":"C","text":"A–T, B–F, C–T, D–T"},{"key":"D","text":"A–T, B–T, C–F, D–F"}],"answer":"C"},{"id":121,"stem":"Select the incorrect match.","options":[{"key":"A","text":"Blood – Specialized connective tissue"},{"key":"B","text":"Tendon – Dense regular connective tissue"},{"key":"C","text":"Areolar tissue – Loose connective tissue"},{"key":"D","text":"Bone – Dense irregular connective tissue"}],"answer":"D"},{"id":122,"stem":"Which of the following is incorrect","options":[{"key":"A","text":"Heart consists of only cardiac tissue"},{"key":"B","text":"In case of plants, animals and microbes morphology refers to study of externally visible features"},{"key":"C","text":"Anatomy is the study of morphology of internal organs"},{"key":"D","text":"The organ and organ system organisation is essential for more efficient and better coordinated activities of millions of cells"}],"answer":"A"},{"id":123,"stem":"Mucus, saliva, earwax, oil, milk tify a vast majority of species present on Earth. Statement II: The number of species that are known and described range between 17–18 lakhs. In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Statement I is correct; Statement II is correct"},{"key":"B","text":"Statement I is correct; Statement II is incorrect"},{"key":"C","text":"Statement I is incorrect; Statement II is correct"},{"key":"D","text":"Statement I is incorrect; Statement II is incorrect"}],"answer":"C"},{"id":134,"stem":"Which of the following statement is correct","options":[{"key":"A","text":"Wheat, rice, mammals, dogs, cats, plants, animals are all same taxa"},{"key":"B","text":"Taxonomic groups are distinct morphological entities and not merely biological aggregates"},{"key":"C","text":"The scientific term for taxa is category"},{"key":"D","text":"Insects represent a unit of classification sharing common features like three pairs of jointed legs"}],"answer":"D"},{"id":135,"stem":"Read the following given statements and choose the correct option","options":[{"key":"A","text":"Osteocytes are present in spaces called lacunae"},{"key":"B","text":"Limb bones interact with smooth muscles attached to them to bring about movements"},{"key":"C","text":"Bone’s matrix is rich in calcium salts but lacks collagen fibres"},{"key":"D","text":"Cartilaginous tissue provides major structural framework to the body of an adult human"}],"answer":"A"},{"id":136,"stem":"Given below are two statements: One is labelled as Assertion (A) and the other is labelled as Reason (R) Assertion (A): Bidder canal is associated with the conduction of sperms of frog. Reason (R): These canals are the part of frog’s reproduction system and connect to the cloaca of frog.","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"A"},{"id":137,"stem":"Which one is correct regarding to Periplaneta americana?","options":[{"key":"A","text":"Body – Divisible in Head, thorax, abdomen & tail segments"},{"key":"B","text":"Hard chitinous endoskeleton is present"},{"key":"C","text":"Cockroaches are only found in India"},{"key":"D","text":"Sclerites are joined by thin, flexible membrane called arthrodial membrane"}],"answer":"D"},{"id":138,"stem":"Select the incorrect statement w.r.t. Rana tigrina.","options":[{"key":"A","text":"On either side of eyes, a membranous tympanum (ear) receives sound signals"},{"key":"B","text":"Digested food is absorbed by the numerous finger-like folds in the inner wall of stomach called villi and microvilli"},{"key":"C","text":"During hibernation, gaseous exchange takes place through skin"},{"key":"D","text":"The lungs are a pair of elongated, pink coloured sac-like structures present in the upper part of the trunk region <PARSED TEXT FOR PAGE: 25 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"B"},{"id":139,"stem":"Cartilage is present A. In the tip of nose and middle ear joints B. Between adjacent bones of vertebral column C. Between adjacent bones of limbs and hands in adults","options":[{"key":"A","text":"A, B and C"},{"key":"B","text":"A and B"},{"key":"C","text":"B and C"},{"key":"D","text":"A and C"}],"answer":"B"},{"id":140,"stem":"Given below are two statements: One is labelled as Assertion (A) and the other is labelled as Reason (R) Assertion (A): All categories together constitute the taxonomic hierarchy. Reason (R): Category is a part of the overall taxonomic arrangement. In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"B"},{"id":141,"stem":"Identify the incorrect statement regarding the rules of Binomial Nomenclature? 1) Biological names are always in Latin and written in Italics 2) The first word in a biological name represents the genus while the second component denotes the specific epithet. 3) Both the words in a biological name, when handwritten, are written in italics, or printed separately underlined to indicate their Latin origin. 4) The first word denoting the genus starts with a capital letter while the specific epithet starts with a small letter.","options":[{"key":"A","text":"3 only"},{"key":"B","text":"2, 3 and 4"},{"key":"C","text":"1, 2 and 4"},{"key":"D","text":"1 and 3"}],"answer":"A"},{"id":142,"stem":"The currently accepted definition of biological species was pioneered by a scientist known as","options":[{"key":"A","text":"The Darwin of 20th century"},{"key":"B","text":"The father of taxonomy"},{"key":"C","text":"The father of evolution"},{"key":"D","text":"The Linnaeus of 20th century"}],"answer":"A"},{"id":143,"stem":"The most abundant and widely distributed tissue in the body of complex animals is","options":[{"key":"A","text":"Epithelial tissue"},{"key":"B","text":"Muscular tissue"},{"key":"C","text":"Connective tissue"},{"key":"D","text":"Nervous tissue"}],"answer":"C"},{"id":144,"stem":"Which of the following matches is not correct","options":[{"key":"A","text":"Cardiac muscle fibres – They never get fatigued"},{"key":"B","text":"Non-striated muscle fibres – Voluntary in action"},{"key":"C","text":"Striated muscle fibres – Light and dark bands are present"},{"key":"D","text":"Skeletal muscle fibres – Intercalated discs are absent"}],"answer":"B"},{"id":145,"stem":"Select the incorrect statement for frog","options":[{"key":"A","text":"Dorsally → Dark irregular spots"},{"key":"B","text":"Ear → Organ of hearing and equilibrium"},{"key":"C","text":"Sexual dimorphism absent"},{"key":"D","text":"Cold blooded"}],"answer":"C"},{"id":146,"stem":"All of the following sense organs in frogs are not well organised structures but are cellular aggregations around nerve endings, except organs of","options":[{"key":"A","text":"Touch"},{"key":"B","text":"Hearing"},{"key":"C","text":"Smell"},{"key":"D","text":"Taste <PARSED TEXT FOR PAGE: 26 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"B"},{"id":147,"stem":"Which of the following does not belong to order Primata","options":[{"key":"A","text":"Gorilla"},{"key":"B","text":"Gibbon"},{"key":"C","text":"Dog"},{"key":"D","text":"Human"}],"answer":"C"},{"id":148,"stem":"Modern taxonomy is based on: (A) External and internal features. (B) Cell structure. (C) Developmental process and ecologicalservices of organisms. Select the correct option:","options":[{"key":"A","text":"(C) only"},{"key":"B","text":"(B) and (C) only"},{"key":"C","text":"(A) and (B) only"},{"key":"D","text":"(A), (B) and (C)"}],"answer":"D"},{"id":149,"stem":"New organisms are constantly being identified as we explore","options":[{"key":"A","text":"New areas"},{"key":"B","text":"Old areas"},{"key":"C","text":"Dense forest"},{"key":"D","text":"Both 1 and 2"}],"answer":"A"},{"id":150,"stem":"Assertion: Reproduction can not be defining characteristic of living organisms. Reason: Many organisms like mules, worker honey bees, sterile human couple do not reproduce","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"A"},{"id":151,"stem":"Choose the correct sequential order where each term represents the next one:","options":[{"key":"A","text":"Taxon → Rank → Category → Group"},{"key":"B","text":"Group → Category → Rank → Taxon"},{"key":"C","text":"Category → Group → Rank → Taxon"},{"key":"D","text":"Rank → Category → Group → Taxon"}],"answer":"B"},{"id":152,"stem":"The term ‘systematics’ refers to","options":[{"key":"A","text":"identification and preservation of plants and animals"},{"key":"B","text":"identification and study of organ systems"},{"key":"C","text":"study of habitats of organisms and their classification"},{"key":"D","text":"diversity of kinds of organisms and their relationship"}],"answer":"D"},{"id":153,"stem":"Assertion: Animals, mammals and dogs are all taxa Reason: Taxa can indicate categories at different levels In the light of the above statements, choose the correct answer from the options given below:","options":[{"key":"A","text":"Both, A and R, are true and R is the correct explanation of A"},{"key":"B","text":"Both, A and R, are true but R is not the correct explanation of A"},{"key":"C","text":"If A is true but R is false"},{"key":"D","text":"If A is false but R is true"}],"answer":"A"},{"id":154,"stem":"Which of the following is not related to frog:","options":[{"key":"A","text":"Close type circulation"},{"key":"B","text":"Blood & lymph present"},{"key":"C","text":"Heart has 2 Ventricle, 1 Auricle"},{"key":"D","text":"R.B.C. is nucleated"}],"answer":"C"},{"id":155,"stem":"Statement 1: Frog never drinks water but adsorbs it through the skin Statement 2: The skin of frog is smooth, slippery and uniformly colored","options":[{"key":"A","text":"Statement 1 is correct, statement 2 is incorrect"},{"key":"B","text":"Statement 1 is incorrect, statement 2 is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect <PARSED TEXT FOR PAGE: 27 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"A"},{"id":156,"stem":"Choose the incorrect option from the following Heart of cockroach","options":[{"key":"A","text":"Has elongated muscular tube"},{"key":"B","text":"Lying along mid ventral line of thorax and abdomen"},{"key":"C","text":"Has closed funnel shaped chambers with ostia on either side"},{"key":"D","text":"All the above"}],"answer":"B"},{"id":157,"stem":"During metamorphosis of cockroach number of moulting are about:","options":[{"key":"A","text":"16"},{"key":"B","text":"10"},{"key":"C","text":"13"},{"key":"D","text":"8"}],"answer":"C"},{"id":158,"stem":"Binomial nomenclature doesn’t ensure","options":[{"key":"A","text":"Each organism has only one name"},{"key":"B","text":"Description of any organism should enable the people in any part of the world to arrive at the same name"},{"key":"C","text":"Names are acceptable to biologists all over the world"},{"key":"D","text":"Names are based on the local language of the place where the organism is found"}],"answer":"D"},{"id":159,"stem":"There are thousands of metabolic reactions occurring simultaneously inside","options":[{"key":"A","text":"All bacteria only"},{"key":"B","text":"All protista only"},{"key":"C","text":"All plant only"},{"key":"D","text":"All living organisms"}],"answer":"D"},{"id":160,"stem":"The number and types of organisms present on earth is termed as","options":[{"key":"A","text":"Population"},{"key":"B","text":"Flora"},{"key":"C","text":"Biodiversity"},{"key":"D","text":"Taxa"}],"answer":"C"},{"id":161,"stem":"How many of the following are absent in frog: Hepatic portal system, Monocondylic skull, Metanephric kidney, Omnivorous nature, Amnion, Pleurodont teeth.","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"3"},{"key":"D","text":"6"}],"answer":"C"},{"id":162,"stem":"Male reproductive system of frog consists of","options":[{"key":"A","text":"A pair of red-coloured testes"},{"key":"B","text":"A pair of yellowish ovoid testes"},{"key":"C","text":"A pair of rounded testes"},{"key":"D","text":"Two pair of rounded testes"}],"answer":"B"},{"id":163,"stem":"Head of cockroach is formed by fusion of ______ segments:","options":[{"key":"A","text":"Six"},{"key":"B","text":"Four"},{"key":"C","text":"Two"},{"key":"D","text":"Eight"}],"a "key":"C","text":"Rosa indica"},{"key":"D","text":"Rosa Indica"}],"answer":"C"},{"id":170,"stem":"Which of the following is incorrect?","options":[{"key":"A","text":"There are 20 cranial nerves in frog"},{"key":"B","text":"Frogs are ureotelic"},{"key":"C","text":"The medulla oblongata passes through the foramen magnum of the spinal cord"},{"key":"D","text":"There are 10–12 vasa efferentia arising from testes"}],"answer":"A"},{"id":171,"stem":"In nerve cord of cockroach, how many segmental ganglia are present in the abdomen?","options":[{"key":"A","text":"9"},{"key":"B","text":"3"},{"key":"C","text":"6"},{"key":"D","text":"5"}],"answer":"A"},{"id":172,"stem":"Frogs are beneficial to mankind because","options":[{"key":"A","text":"They eat insects and protect crops"},{"key":"B","text":"They serve as food for men"},{"key":"C","text":"They control malaria by eating mosquito’s larvae"},{"key":"D","text":"They increase soil fertility by producing humus"}],"answer":"A"},{"id":173,"stem":"The main difference between taxonomy and systematics is that:","options":[{"key":"A","text":"Taxonomy is involved in the naming and classification of organisms while systematics is involved in determining evolutionary relationships between organisms"},{"key":"B","text":"Systematics is involved in the naming and classification of organisms while taxonomy is involved in determining evolutionary relationships between organisms"},{"key":"C","text":"Taxonomy is involved in the naming and classification of organisms while systematics includes taxonomy along with determining evolutionary relationships between organisms"},{"key":"D","text":"Systematics can be considered as a part of taxonomy"}],"answer":"C"},{"id":174,"stem":"In the taxonomic hierarchy, for Panthera leo: I. Genus will be a taxon and Panthera will be a category II. Species will be a taxon and leo will be a category","options":[{"key":"A","text":"Both I and II are correct"},{"key":"B","text":"Only I is correct"},{"key":"C","text":"Only II is correct"},{"key":"D","text":"Both I and II are incorrect"}],"answer":"D"},{"id":175,"stem":"Among Triticum, Solanum, Mangifera, Datura, Petunia and Allium, how many of them belong to the same family?","options":[{"key":"A","text":"Two"},{"key":"B","text":"Four"},{"key":"C","text":"Three"},{"key":"D","text":"Five <PARSED TEXT FOR PAGE: 29 / 31> Concept Builder Test Series- NEET 2026 SELEXN"}],"answer":"C"},{"id":176,"stem":"Read the following statements and select the correct option A. No non-living object exhibits metabolism. B. Isolated metabolic reactions in vitro are called living reactions","options":[{"key":"A","text":"Only A is correct"},{"key":"B","text":"Only B is correct"},{"key":"C","text":"Both statements are correct"},{"key":"D","text":"Both statements are incorrect"}],"answer":"A"},{"id":177,"stem":"In potato, brinjal, lion, leopard, and tiger, how many species and genera are there respectively?","options":[{"key":"A","text":"4 & 2"},{"key":"B","text":"5 & 3"},{"key":"C","text":"5 & 4"},{"key":"D","text":"5 & 2"}],"answer":"B"},{"id":178,"stem":"'X' is the process by which anything is grouped into convenient categories based on some easily observable characters. The process 'X' is:","options":[{"key":"A","text":"Nomenclature"},{"key":"B","text":"Identification"},{"key":"C","text":"Classification"},{"key":"D","text":"Reproduction"}],"answer":"C"},{"id":179,"stem":"Which of the following statement is incorrect regarding species?","options":[{"key":"A","text":"Members of a species can interbreed naturally and produce fertile offspring"},{"key":"B","text":"Potato plants grown from a single parent tuber are of the same species"},{"key":"C","text":"Mule is considered a separate species because it has character of both horse and donkey"},{"key":"D","text":"Species is the basic unit of classification"}],"answer":"C"},{"id":180,"stem":"Statement 1: Bacteria reproduce asexually by binary fission. Statement 2: Species cannot be defined in the case of bact function chooseExplanation(q){
  const s=(q.stem+" "+q.options.map(o=>o.text).join(" ")).toLowerCase().replace(/–/g,"-");
  let best=explanationTopics[explanationTopics.length-1],score=0;
  for(const t of explanationTopics){
    let sc=0;
    for(const k of t.keys){if(s.includes(k.toLowerCase()))sc+=k.length>5?2:1}
    if(sc>score){score=sc;best=t}
  }
  return best;
}
function buildExplanation(q){
  const key=answerKey[q.id];
  const ans=(q.options.find(o=>o.key===key)||{}).text||"";
  const t=chooseExplanation(q);
  return '<h4>NCERT Explanation · Q'+q.id+'</h4>'+
    '<div class="expRef"><b>NCERT reference:</b> '+t.ref+'</div>'+
    '<div style="margin-top:8px"><b>Correct option: '+key+'</b><br>'+ans+'</div>'+
    '<div style="margin-top:10px"><b>Why?</b><br>'+t.why+'</div>'+
    '<div style="margin-top:10px"><b>🔥 NEET Trap</b><br>'+t.trap+'</div>';
}
function toggleExplanation(){
  const box=document.getElementById("sideExplain");
  if(!state.submitted){box.classList.remove("show");return}
  if(box.classList.contains("show")){box.classList.remove("show");return}
  box.innerHTML=explanations[current]||buildExplanation(qmap[current]);
  box.classList.add("show");
}

function showResult(){let c=0,i=0,sk=0;for(const q of questions){const a=state.answers[q.id];if(!a)sk++;else if(a===answerKey[q.id])c++;else i++}document.getElementById("score").textContent=c*4-i;document.getElementById("correct").textContent=c;document.getElementById("incorrect").textContent=i;document.getElementById("skipped").textContent=sk;document.getElementById("result").classList.add("show")}
function submitTest(){if(state.submitted)return;const unanswered=questions.length-Object.keys(state.answers).length;if(unanswered&&!confirm(unanswered+" questions are unanswered. Submit anyway?"))return;state.submitted=true;save();showResult();render()}
