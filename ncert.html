<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCERT Questions</title><style>:root{--i:#183447;--m:#71818a;--l:#dbe4e3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f2f6f4,#fbfcfa 50%,#edf4f4);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:18px;max-width:1100px;margin:auto}.head{margin-bottom:16px}.ey{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#607782}.title{font:500 34px Georgia,serif;margin:6px 0}.sub{font-size:11px;color:var(--m);letter-spacing:.12em;text-transform:uppercase}.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.chapter{border:1px solid var(--l);background:#fff;border-radius:15px;padding:17px;cursor:pointer;transition:.15s}.chapter:hover{background:#f2f7f5;border-color:#cbdad7;transform:translateY(-1px)}.chapter b{font-size:14px}.chapter span{display:block;font-size:10px;color:var(--m);margin-top:5px}.cbt{display:none}.cbt.show{display:block}.back{border:1px solid #d5e0de;background:#fff;color:#365766;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:11px;margin-bottom:10px}.frame{height:calc(100vh - 95px);min-height:650px;border:1px solid var(--l);border-radius:15px;overflow:hidden;background:#fff}.frame iframe{width:100%;height:100%;border:0}@media(max-width:650px){.chapters{grid-template-columns:1fr}.wrap{padding:12px}.title{font-size:29px}.frame{min-height:620px}}</style></head><body><div class="wrap"><div id="list"><div class="head"><div class="ey">NEET · NCERT</div><div class="title">NCERT Questions</div><div class="sub">Select a chapter to open CBT Mode</div></div><div class="chapters"><div class="chapter" data-file="cbt.html"><b>Hydrocarbon</b><span>350 Questions · CBT Practice</span></div><div class="chapter" data-file="photosynthesis.html"><b>Photosynthesis</b><span>235 Questions · CBT Practice</span></div></div></div><div id="cbt" class="cbt"><button class="back" id="back">← Back to Chapters</button><div class="frame"><iframe id="frame" title="NCERT CBT"></iframe></div></div></div><script>const list=document.getElementById('list'),cbt=document.getElementById('cbt'),frame=document.getElementById('frame');document.querySelectorAll('.chapter').forEach(x=>x.onclick=()=>{frame.src=x.dataset.file+'?v=12';list.style.display='none';cbt.classList.add('show');window.scrollTo(0,0)});document.getElementById('back').onclick=()=>{frame.src='about:blank';cbt.classList.remove('show');list.style.display='block'};</script></body></html>
